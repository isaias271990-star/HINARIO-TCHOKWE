ise nyi thachi yeswe!","Yimbila Zambi a mbunge yami!","Muhalise mathangwa eswe."]},{"t":"v","n":2,"l":["Ngunalise ku zango Lienyi!","Nguli mukwa ku suswamiana!","Angelo yeza, yaneha","Sangolia chawana cha Zambi."]},{"t":"v","n":3,"l":["Ngunyongonone nyi zango Lie.","Ngu wahilile Mwene wami:","Mu pangu lienyi ngunedela,","Ha uthu nyi zango lia Yesu"]}]},{"n":30,"ti":"Kristu nawa","b":[{"t":"v","n":1,"l":["Yuma ya Yesu nazanga","Nazanga nyi zango Lienyi","Nguzale nyi keke Yenyi","Nyi kusula chenyi nawa."]},{"t":"c","l":["Ngu zange nawa kristu!","Ngu zange nawa Kristu!","Nyi zango lienyi liahiana","Nawa yena Chilamwina."]},{"t":"v","n":2,"l":["Yuma ya kristu nguyivwe","Ngunonoke kuli Kristu,","Shipiritu ya umwenemwene","Yitu songwele nyi keke."]},{"t":"v","n":3,"l":["Nguna zange ngupwe hehi,","Nguli nunge nyi zango Lie,","Hanga liji Lie ngulivwe,","Hanga ngufunge shimbi Je."]},{"t":"v","n":4,"l":["Mungu kamona mwe Kristu","Mahinga wanangana Wenyi","Upwe kama mu mbunge yami","Musono ndo nyi kulutwe."]}]},{"n":31,"ti":"A Yesu nakuzanga.","b":[{"t":"v","n":1,"l":["Yesu nakuzanga uli nyi wami;","Ha vumbi lia Yena ngukuhalise.","Uli longeshi,nyi mwe Mwanangana","wami, kuli yena kristu mungu kononoka."]},{"t":"v","n":2,"l":["Nakuzanga, mumu wangu fwilile,","Nguna komoka, ha zango lia Yena,","Kuli yena najikijila ndo ku miaka;","Kuli yena Kristu mungu kononoka!"]},{"t":"v","n":3,"l":["Nguchili nyi Mwono mungu kuzanga;","Ngukwimbile miaso ya uhaliso,","Nguna zange tukapwe hamwe ndo","kumiaka;","kuli yena Kristu mungu kononoka"]}]},{"n":32,"ti":"Au nafuliela nguna munyingika","b":[{"t":"v","n":1,"l":["Cha nyigikine zango-ali","Zambi asolwele,","Mumu ya tuma Mwanenyi","yafwa hali yami."]},{"t":"c","l":["Nanyingika namufuliela,","Yiye mahasa ku ngupulula","Mafunga upite wami","Ndo muze makesa."]},{"t":"v","n":2,"l":["Na yambashana Spiritu","Ya kungusongwela,","Mu yitulwesa ngo kristu","Yiye mwe chikwashi."]},{"t":"v","n":3,"l":["Yipi nyi ipema yeswe","Yili muli yami;","Alioze ha 