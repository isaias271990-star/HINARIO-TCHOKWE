name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Empacotar Hinos e Compilar
        run: |
          # 1. Renomear pastas se necessario
          [ -d "aplicativo" ] && mv aplicativo app || true
          [ -d "app/src/main/Ativos" ] && mv app/src/main/Ativos app/src/main/assets_temp || true
          [ -d "app/src/main/Assets" ] && mv app/src/main/Assets app/src/main/assets_temp || true

          # 2. Criar a pasta oficial assets
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/assets/data
          mkdir -p app/src/main/assets/dados

          # 3. Encontrar index.html em qualquer lugar e copiar tudo para assets
          INDEX_FILE=$(find . -name "index.html" | head -n 1)
          if [ -n "$INDEX_FILE" ]; then
            SRC_DIR=$(dirname "$INDEX_FILE")
            echo "Copiando arquivos web de $SRC_DIR para app/src/main/assets/"
            cp -rf "$SRC_DIR"/* app/src/main/assets/ || true
          fi

          # 4. Encontrar hinos.json e garantir nas pastas data e dados
          HINOS_FILE=$(find . -iname "*hinos*.json" | head -n 1)
          if [ -n "$HINOS_FILE" ]; then
            echo "Hinos encontrado: $HINOS_FILE"
            cp -f "$HINOS_FILE" app/src/main/assets/data/hinos.json
            cp -f "$HINOS_FILE" app/src/main/assets/dados/hinos.json
            cp -f "$HINOS_FILE" app/src/main/assets/hinos.json
          fi

          # 5. Ativar permissao no MainActivity para o Samsung S21
          MAIN_JAVA=$(find app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_JAVA" ]; then
            if ! grep -q "setAllowFileAccess" "$MAIN_JAVA"; then
              sed -i '/setJavaScriptEnabled/a \        webSettings.setAllowFileAccess(true);\n        webSettings.setAllowContentAccess(true);\n        webSettings.setAllowFileAccessFromFileURLs(true);\n        webSettings.setAllowUniversalAccessFromFileURLs(true);' "$MAIN_JAVA" || true
            fi
          fi

          # 6. Forcar o Gradle a incluir os assets na compilacao
          if ! grep -q "assets.srcDirs" app/build.gradle; then
            sed -i '/android {/a \    sourceSets { main { assets.srcDirs = ["src/main/assets"] } }' app/build.gradle || true
          fi

          # 7. Listar conteudo de assets
          echo "=== CONTEUDO DE ASSETS ==="
          ls -lhR app/src/main/assets/

          # 8. Compilar APK com Gradle 8.7
          gradle assembleDebug --stacktrace

          # 9. Inspecionar tamanho do APK
          echo "=== ARQUIVO APK ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets|index" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-IASD
          path: '**/build/outputs/apk/debug/*.apk'
