 nyi zango","Ku mutu kakumba;","Zambi yiye Mukwa thachi","Tumusenu vumbi!","Zambi yiye Mukwa thachi,","Tumusenu vumbi."]},{"t":"v","n":4,"l":["Enwe mavungu malimi,","Halisenu mwene;","Wa patwile e malenge,","Tumusenu vumbi!","Wa patwile e malenge,","Tumusenu vumbi."]}]},{"n":9,"ti":"Tuhalisenu Kristu Longeshi","b":[{"t":"v","n":1,"l":["Tuhalisenu Yesu longeshi mupema!","Hakulusu watu fwilile.","Hana tukonekena ye shili yetu,","Hakulusu manyinga amwanganyine,","Halisenu nyi kumu chichimieka,","Hako lietu kechi katwehuka"]},{"t":"c","l":["Tuhalisenu Yiye wika se Mwene","Kuma tukonekena chawana"]},{"t":"v","n":2,"l":["Tuhalisenu Yesu longeshi wa Mwilu,","Kaku kanyamisa akwa shili.","Twambujole yiwape Yenyi yipema,","Yize Chilamwina anatwehe,","Yenu eswe tupinji twa mwene","Yesu mumu aye kechi katwehuka"]},{"t":"v","n":3,"l":["Tuhalisenu Yesu longeshi wa Mwilu!","Twimbe, twimbenu ha zango Lienyi.","Akwa Yesu twimbilenu hamuwika","Tuhalise ha unene nyi uhenya!","Mwe kafunga Yesu mafunga nyi-Enyi,","Kristu malamwina akwa-ufulielo."]}]},{"n":10,"ti":"Uhenya kuli Chilamwina","b":[{"t":"v","n":1,"l":["Kuheta ku kulusu Lienyi","Yingu wayila Chilamwina.","Mba yeva kulinyenga chami","Uhenya wenyi!"]},{"t":"c","l":["Uhenya kuli mwene!","Uhenya kuli Mwene!","Yiye wika mangu lamwina","Uhenya Wenyi."]},{"t":"v","n":2,"l":["Zango lienyi nguna komoka,","Shili yangu konekena pe!","Yangu jitula maswi jami,","Uhenya Wenyi!"]}]},{"n":11,"ti":"Muthumbu wa chimene","b":[{"t":"v","n":1,"l":["Zambi chemene mangwiva.","Hakumu halisa;","Mungu mwita Yiye Mwene;","Kuma kangu kwasa."]},{"t":"v","n":2,"l":["Muze shipiritu ya yena,","Muyingu songwela;","Yingu hetese mwe Mwilu,","Tuka twame hamwe."]},{"t":"v","n":3,"l":["Tuli ane utufunge","Utukwate kama.","Ndo ha kukaheta Mwilu","Tuka lilamwine."]}]},{"n":12,"ti":"Pangu lia mumbunge","b":[{"t":"v","n":1,"l":["Pangu lili ku milundu,","Nyi mukalunga nawa,","Mwalwa wa tangwa unatu,","Nyi mumisenge mwapwi;","Pangu likwo linapeme,","Nyi mbunge yami yesw