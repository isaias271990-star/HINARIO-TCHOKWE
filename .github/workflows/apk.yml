 Vumbi hajina Lienyi;","Kanda tuhilukila kunyima!"]},{"t":"c","l":["Halisenu…Halisenu","B.T. Halisenu …Halisenu,","Aswane…Afumane","B.T. Afumane…Afumane,","Mwene…Mwene","B.T. Mwene…Mwene,","Hano hashi nyi mwilu","Tulinunge nyi athu ja Yesu,","Ufulielo twendele mu pangu","lia mwilu;","usoma muwiza lamba hiliahwa,","kanda tuya kunyima."]},{"t":"v","n":2,"l":["Nguna zange shikola yasambata,","Nguhase kulithathika nyi mata;","Muwande Wenyi mutuli thachika,","Kanda tuya kunyima."]},{"t":"v","n":3,"l":["Kulimika chahwa tuwahilile,","Luyinda wetu kechi kaheta ko;","Ku Shiyono kuli chiseke chinji,","Kanda tuya kunyima."]}]},{"n":216,"ti":"Kushikola ya sambata","b":[{"t":"v","n":1,"l":["Mujina Lie tuputuke,","Shikwola yino a Mwene!","Tuna kwichi nyi zango Lie,","Tweya upwe Kasongo ketu."]},{"t":"c","l":["Sambata jeswe twakwizaza,","Ku shikola Ye a Yesu.","Tweya Mwene utu longese.","Mujila Ye ya pangu."]},{"t":"v","n":2,"l":["Shikola yacho yatu longesa,","Kuzeyela shimbi Je;","Yina twambe hanga tupwe","Akwa-kushishika ndo kufwa."]},{"t":"v","n":3,"l":["Tu longese kama Yesu,","Kwononokena shimbi Je;","Kutuna kutwaminyina","Hanga utuwahise."]}]},{"n":217,"ti":"Ha shimbu ya sambata","b":[{"t":"v","n":1,"l":["Tweyenu ku Sambata kawashi,","Tujikize nyi thachi,","Nyi zango lia kulilongesa,","Tuyenu hamwe nyi Yesu."]},{"t":"v","n":2,"l":["Longeshi munene Kristu,","Watuzangile chinji,","Hakulusu kana tulweze","Umwene mwene nyi zango."]},{"t":"v","n":3,"l":["Lemesenu zango liacho,","Mwene atuhele;","Nyi mbunge kulikehesa","Tuye jila ya mwilu."]},{"t":"v","n":4,"l":["Muze mutu kalilongesa,","Mu mbongo nyi kulila;","Mutuka njila mushikola.","Mwene matusongwela."]}]},{"n":218,"ti":"Lieza kanawa tangwa lia sambata","b":[{"t":"v","n":1,"l":["Hilieza chochene,","Tangwa lia Mwene,","Hanga litwi-ulwise","Yitanga Yenyi, zango Lienyi.","Muchifuchi nyi yizezo yipi","Chindulula mbunge jetu","Chindulula mbunge jetu."]},{"t":"v","n":2,"l":["Tweya Thuminyi ya Mwilu,","Tungulula ye mbunge","Ndo etu mutupwa","Nyi ungunu We","Tuchize kama shingo lieswe!","Tufungile ha kwoko Lie","Tufungile ha kwoko Lie."]},{"t":"v","n":3,"l":["Tweya nyi unene We,","Twambe yipema wene","Kwasa umwe ha umwe","Hanga mu zango Lie","Afupe ulamwino muli Yena","Twehe kama ulamwino We!","Twehe kama ulamwino We!"]}]},{"n":219,"ti":"Tweya shipiritu yazango","b":[{"t":"v","n":1,"l":["Tweya Shipiritu Ya zango","Mwe liembe wa Mwilu,","Twehe che chivukuminya","Cha shima lia mwono","Cha shima lia mwono."]},{"t":"v","n":2,"l":["Hetula je mbunge jetu,","Mutchifuchi chipi;","Twehe chawana chipema","Tukwononokene","Tukwononokene"]},{"t":"v","n":3,"l":["Twalela tukonekene,","Tulamwine ku-upi;","Tulongese shimbi Je","Lie liji lia Mwilu.","Lie liji lia Mwilu."]}]},{"n":220,"ti":"Chiwanyino cha Mwene","b":[{"t":"v","n":1,"l":["Mandumbu hitwa kunguluka","Kumeza ya Mwene.","Hatuzalisa nyi zango","Lia mwilu lia Mwene,","Yinyingi yize twamona","Upeme wa miaka yeswe","Nyi zango tunalihana","Shili yize twalinga."]},{"t":"v","n":2,"l":["Shili yaneha hashi","Ufwe nyi kwenyeka","Zango lia Yesu linji","Yatulamwina ku upinji.","Tuna sakwila tuli eswe","Yesu hakutuila;","Yitanga yetu yeswe,","Twayisa hakulusu."]},{"t":"v","n":3,"l":["Yakunyima nyi yinyengo-","Yatoka hakulusu;","Etu hapwila chiseke","Uwahililo kuli Zambi.","Tunasakwila nyi miaso-","Tuna vumbika Mwene-","Ha keke Yenyi nyi yetu","Nyi zango lia miaka yeswe."]}]},{"n":221,"ti":"Mwene yena unatusanyika","b":[{"t":"v","n":1,"l":["Mwene, Yena una tusanyika,","Twi-uluke chiwanyino Che,","Twahichika milimo yeswe","Hanga tupwe nyi Yena.","Kuyuka chetu Mwene","Yinyingi ya ufwe","Ha kulitakana cha zango."]},{"t":"v","n":2,"l":["Mujimba we wakulemeka,","Una twehe ulamwino","Mbolo watuhele hanga,","Tulinunge nyi","Musenge wa yinyengo;","Waunwine Yena Yesu","Hakulusu watuhele musenge upema."]},{"t":"v","n":3,"l":["Nyi milimo hiyahwa,","Ha ufwe ukalu,","Wazulwile jila ku","Mwono wa miaka","Hi yitanga ko wika","Twakunyingikina Yena!","Tuna nyingika mbunge","Ye yazango."]}]},{"n":222,"ti":"Tweya usongwele chiwanyino","b":[{"t":"v","n":1,"l":["Meza ha yala a Chilamwina,","Tweya wisongwele!","Palula mbolo uhane vinyu","Yinyingi, ya Yena Yesu."]}]},{"n":223,"ti":"Mbimbiliya kuchi yinambe?","b":[{"t":"v","n":1,"l":["Mbimbilia kuchi yinambe?","Liji lilemu kuli yami","Chichi kujikijila longeso lia athu","Zambi kuchi ana nwambulwila?"]},{"t":"c","l":["Mbimbiliya kuchi yinambe?","Fupenu kuyi nyingika;","Kumi lia shimbi fungenu jeswe","Yesu haliapwila meza!"]},{"t":"v","n":2,"l":["Akehe azanga shimbi ja Zambi,","Akehe anajifungu;","Amwe kazanga kuji thuthulula","Kuchiza ko ye Sambata."]},{"t":"v","n":3,"l":["Muze makeza kuchi munukamba?","Yenwe kunwajifungile;","Makanuwana kununa sambe?","Kumbululenu musono."]}]},{"n":224,"ti":"Shina ho kuononoka","b":[{"t":"v","n":1,"l":["Kuononoka shinaho kuhiana itapo,","Shinaho shimbu yeswe kufunga","Je shimbi."]},{"t":"c","l":["Kuli Zambi, nyi ufulielo tuyenu","Ku je shimbi, tuononokenu.","Keshika kounonoka shinaho itapo,","Shinaho shimbu yeswe kufunga","je shimbi."]},{"t":"v","n":2,"l":["Yenue nuakuamba ngwo, shimbi","jishi ulemu","ononokenu yisonyeko nwiuluke."]},{"t":"v","n":3,"l":["Uwahiso wika,wa akufunga shimbi,","Nyi chimwe nawa mutchikumba","Kuononoka."]}]},{"n":225,"ti":"Shimbi ja Mwene wami","b":[{"t":"v","n":1,"l":["Jilemu nawa jipema,","Je shimbi ja Mwene wami;","Ja kwalumuna we mwono,","Mukwa shili te matoka."]},{"t":"c","l":["B.T. Cha Mwene …","S.C. Cha Mwene che kulongesa","B.T. China …zala nyi yiyulo","S.C. China …zala nyi yiyulo…","Eswe: Chinazala nyi je shimbi","Mujitu kanyamisa."]},{"t":"v","n":2,"l":["Kulongesa cha Yehova,","Cha ululi chipema;","Chinapu ngwe katalilo,","Ngumwene ho upi wami"]},{"t":"c","l":["B.T. Ngwe tangwa…","S.C. Jinatu tangwa munyima,","B.T. Je shimbi…Ja Mwene,","S.C. Je shimbi…Ja Mwene,","Eswe; jitemwine mitwe yetu","Nyi lie pangu lia Mwilu."]}]},{"n":226,"ti":"Ufulielo kukumba","b":[{"t":"v","n":1,"l":["Tujita twa Yesu Mwene","Laulenu kawashi!","Ufuku uneza milima pwi","Tuli thachikenu.","Lithachikenu nyi akwa khole","Kanda nukokoloka","Ufulielo che kukumba","Tukumbe Satana."]},{"t":"c","l":["Ufulelo kukumba","Ufulielo ukwete unene,","Ufulielo che kukumba","Ukakumbe Satana."]},{"t":"v","n":2,"l":["Mushi lia pendelo lietu","Lie zango lia Zambi,","Twendenu mu jila ayi,","Yakutwala mwilu,","Akwa ufulielo asandu","Hakumba Satana;","Ufulielo che kukumba,","Tupwe nyi sambukila."]},{"t":"v","n":3,"l":["Tuli nyi akwa khole hano,","Kana chikimisa,","Tuhichike yeswe hano,","Tulithachikenu,","Nyi lukepwe wa ulamwino","Yesu maka twaha","Tutayizenu nyi mbunge","Makatulamwina."]},{"t":"v","n":4,"l":["Mweswe makumba nyi ufulielo","Kumakamujika,","Maka mwaha jina liaha","Mamukonekena, nyi mbunge ja","Ufulielo","Jato nyi lie zango, tuka kumbe","Nyi ufulielo, maka twaha","Mwene."]}]},{"n":227,"ti":"Longeshi yami mupema","b":[{"t":"v","n":1,"l":["Longeshi mupema, Soma ya Yeswe,","Ena Muthu, Zambi, Kristu Yesu.","Mukuhalisa, nyi kukulingila","Uli uhenya wami nyi Kristu."]},{"t":"v","n":2,"l":["Yitemo yamuyambu cho kupema,","Yepemese mathungu!","Kristu kanuhiana, Aye mupema,","Mukwa uthu, shimbu yeswe."]},{"t":"v","n":3,"l":["Tangwa cho kupema nyi kakweji!","Kuhenyama chenu kuchishi shimbu!","Liahenyama, liatemuka. Lipema.","Ndo kuli Yesu, Soma wahiana!","Améne!"]}]},{"n":228,"ti":"Yesu mwe yeswe kuli yami","b":[{"t":"v","n":1,"l":["Yesu mwe yeswe kuli yami","Mwono wa chiseke;","Thachi ja lukhanda wami","Nyi nanyenganyana ndo Yiye,","Pundu keshi kunguvulama","Yiye wanguvisa chiseke","Kristu yami."]},{"t":"v","n":2,"l":["Yesu mwe yeswe kuli yami","Sepa ha lie lamba;","Kakungwaha we uwahiso,","Kakupa we unji.","Kakungwa vula nyi mwalwa","Mungupwa nyi mbuto yinji","Vula, mwalwa nyi lie pangu,","Kristu yami."]},{"t":"v","n":3,"l":["Yesu mwe yeswe kuli yami.","Ndo ngumuzeyele","Sepa liami munene","Chalikalile ye.","Kwenda nyi Yiye cho chiseke","Mujila yipema nguli","Nyi Yesu nguli mu pangu","Kristu yami."]},{"t":"v","n":4,"l":["Yesu mwe yeswe kuli yami;","Mwe mapa chiseke","Yiye ujikijilo wami,","Cha honene sambukila.","Kupwa kwe kulumbu Lienyi","Kulenga chami cha miaka","Nguka puluke ku-upi","Kristu yami."]}]},{"n":229,"ti":"Kristu wika Yiye pangu","b":[{"t":"v","n":1,"l":["Angelo memba miaso;","Kristu Yiye pangu;","Uhenya Soma Pangu!","Kristu Yiye pangu."]},{"t":"c","l":["Twendenu mu pangu, lilemu","Lina temwina Mwilu nyi hashi;","Kuli waha pangu lia Yesu!","Kristu Yiye lie Pangu."]},{"t":"v","n":2,"l":["Muswanisenu mavungu!","Kristu Yiye lie Pangu;","Tumwimbilenu miaso,","Kristu Yiye lie Pangu."]},{"t":"v","n":3,"l":["Muwayilenu nyi thachi,","Kristu Yiye lie Pangu;","Yiye Chilamwina chetu,","Kristu Yiye lie Pangu."]},{"t":"v","n":4,"l":["Uhenya vulie Mwanangana!","Kristu Yiye Pangu;","Hana kumbu Satana,","Kristu wika lie pangu."]}]},{"n":230,"ti":"Twama nyi yami Chilamwina","b":[{"t":"v","n":1,"l":["Mwe Chilamwina nazanga","Nguvile kama kheke Ye;","Lelwa lia hashi nyi limwe","Muli nguchiza pangu lia mwilu."]},{"t":"v","n":2,"l":["Muze muka hinduka mu ufwe","Ngukapwe kulutwe Lie;","Hakuputuka milimo yami,","Ngusongwele nyi ngupulule."]},{"t":"v","n":3,"l":["Tweya ungwehe unene We","Mba nguka hase kukumba","Kusongwela cha mukwa kwonga;","Pwako nyi yami Chilamwina."]}]},{"n":231,"ti":"Ngusongwele Longeshi yami","b":[{"t":"v","n":1,"l":["Ngusongwele, Longeshi yami","Nyi kwoko Lie","Ha chocho kanda uhona","Kungu pulula!","Chichi kuhasa kwenda,","Nyi chishi nyi Yena;","A Yesu pwako shimbu yeswe","Luthemo wami!"]},{"t":"v","n":2,"l":["Ku chawana Che jingilika","Mbunge yami","Yehe sambukila kuluyinda","Mba nguka hwime muli Yena","Haka mwihi nyi kulusu,","Kanda ungu handununa","Kuli Yena Yesu."]},{"t":"v","n":3,"l":["Nyi muze kulithachika","Chinene hichapwa,","Uka ngusongwele, Longeshi yami","Nyi kwoko Lie,","Nyi kanda ungwehuka","Ha kupulula Che."]}]},{"n":232,"ti":"Hingu nafu hakulusu","b":[{"t":"v","n":1,"l":["Hingu naku fila hakulusu,","Mukwa shili!","Manyinga hana mwangana,","Yikola nevwile.","Nafilile hakulusu,","Chenacho Ami nakawile","Nakuchijile milima,","Yika wangu lingila?"]},{"t":"v","n":2,"l":["Himokomoko ko","Nahichikile Usoma","Chasumbakenyene uhenya,","Haze ha kulusu.","Zuwo liasalile mwilu","Napwile mwe chilambala;","Kanda upwa nyi tuliongelo,","Yika wangu lingila?"]},{"t":"v","n":3,"l":["Lamba liokele naye!","Lize naku mwenene,","Kukushilimwe likwo,","Lize nahongelele","Ufwe naulelesele,","Hanga mba nguku lamwine","Kulamba shimbi ya miaka;","Yika wangu lingila?"]}]},{"n":233,"ti":"Cheseko","b":[{"t":"v","n":1,"l":["Eswe ya woma anambe","Yili mujila nguli;","Kamwene pangu zwalala","Mujila muze nguli"]},{"t":"c","l":["Yesu ku mangusongwela,","Heza apwe nyi yami","Chifuchi cha to nyi khole,","Chahashile kwenda wika."]},{"t":"v","n":2,"l":["Mahanjika yamahuza,","Nyi yeseko yikalu;","Yesu kuma kangufunga","Makangu lembejeka."]},{"t":"v","n":3,"l":["Nguli nyi zango likehe,","Mulingu vulumwisa;","Ukwaso Wenyi wa mwilu,","Mba hanga ngukakumbe."]}]},{"n":234,"ti":"Kristu endese wato wami","b":[{"t":"v","n":1,"l":["Kristu endesa wato,","Kalunga matenuka,","Kakutenuka chinji,","Mashindamisa wato","Tweya Yesu utwendese,","Songwela wato wami."]},{"t":"v","n":2,"l":["Kuwa kulembejeka","Ngwe naye hali mwana,","Tweya kalunga ahole,","Kana tenuka chinji,","Tweya Kristu usongwele,","Songwela wato wami."]},{"t":"v","n":3,"l":["Himutu heta kuzuzu,","Hindu kanatenuka,","Kumu ngwivwa chiseke","Mungwivwa Yesu mamba;","Njila ngeji mukwa lamba,","Mu-uhwimino wa Mwene."]}]},{"n":235,"ti":"Zango liahiana","b":[{"t":"v","n":1,"l":["Wangu fupile yami,","Yesu mwe Kafunga;","Yangu wana mulamba!","Yangukula nyi zango;","Angelo mwilu embile,","Hakusolola zango lio."]},{"t":"c","l":["Lie zango liahiana!","Nyi ndando yinene!","Yesu afetele hakulusu,","Yangu lweza zango liahiana!"]},{"t":"v","n":2,"l":["Yilonda yami yinji,","Yesu yangu kwata;","Mba yangu lweza ngwenyi","Hiwapwa nyi Wami!","Alio liji lia chiseke","Nguye nyi ye sambukila!"]},{"t":"v","n":3,"l":["Yesu –yangulweza je mbandu","Mumu hali yami,","Chipangula cha mbimbo,","Yamusa hakulusu,","Chika angu mwene nacho,","Amwenene lamba liacho!"]},{"t":"v","n":4,"l":["Shimbu yina palika,","Nguli nyi sambukila","Nguna mutwaminyina","Hanga angu wahise!","Yesu muze mangwijila,","Mungu katwama ndo miaka!"]}]},{"n":236,"ti":"Hakujika tembele","b":[{"t":"v","n":1,"l":["Tuhalisenu Zambi nyi miaso","Ha uwahiso Aye ana twehe Anenyi,","Mumu mutuyihana kuli Mwene;","Tembele yino ha Vumbi nyi kuhalisa."]},{"t":"c","l":["Halisenu nyi miaso ya zango","Halisenu, linungenu nwimbe","Twimbenu uhaliso wa Yesu","Chilamwina.","Ha uwahiso anahana kuli eswe."]},{"t":"v","n":2,"l":["Ngwe luthemo una temwina milima,","Una lweze ngeji unende mukalunga;","Muzuwo pangu lia Mwilu linatu,","Ha ulamwino wa-akwa kutoka."]},{"t":"v","n":3,"l":["Muno, afuliela kaneza akuwayile,","Kuwayila Mwene chipema lume;","Mutwaha thachi jikuase,","Eswe kaneza akuwayile"]}]},{"n":237,"ti":"Tembele yikwo nawa","b":[{"t":"v","n":1,"l":["Zambi musono kutuna putuka","Chinyingi cha kwambujola zango Lie;","Tembele muyisongwela mwilu,","Uhaliso woke!"]},{"t":"c","l":["Uhenya wa Zambi, uhenya wa Zambi!","Ana Je akwimbile!","Uhenya wa Zambi, uhenya wa Zambi!","Uhenya wa kwilu!"]},{"t":"v","n":2,"l":["Zuwo lia Vumbi, chinyingi cha","Pangu","Tutambwile mo ulamwino","Wa sango anehene Mwene Yesu","Nyi keke yahiana!"]},{"t":"v","n":3,"l":["Taka lize lia umwene mwene","Lia lie zango lie nyi kuzanga Che;","Muno akwa shili kumakevwa","Mba upale wo uka."]},{"t":"v","n":4,"l":["Zuwo lino lipwe lia kulembela,","Chihela cha Mwene Zambi,","Kujila cha mwilu nyi ukonekeno,","Mwono wa sambukila!"]}]},{"n":238,"ti":"Ufuku wa sambukila","b":[{"t":"v","n":1,"l":["Sambukila nyi lie zango","Yeswe yangu jingilika;","Ku mbele asemukine,","Soma wa sambukila","Mwe Chilamwina,","Yesu Mwene wetu."]},{"t":"v","n":2,"l":["Uhenya wa Zambi, kuli, Zambi.","Kanembi angelo mwilu,","Sango ja ukonekeno","Chawana cha ulamwino","Cheseko cha zango,","Yesu matwaha."]},{"t":"v","n":3,"l":["Soma ya zango, nyi sambukila","Watangile Chifuchi","Tweyenu hanga tumwite","Hanga atusongwele","Chifuchi cha pangu,","Yesu Mwene wethu."]}]},{"n":239,"ti":"Mwaso ukulu","b":[{"t":"v","n":1,"l":["Twevanga ko miaso yipema","Ha muchima ufuku","Yakwimba kanawa nyi angelo","Mujimbi ja kwilu","Hashi chiseke kuli athu","Makololoka Soma","Hashi yeswe kulungunga","Hakwivwa angelo."]},{"t":"v","n":2,"l":["Tala tala makoke kwilu","Nyi maphulwa akwazulula","Miaso tunayivu muthethela","Kwambulula cha kwilu","Kumilundu nyi ku mihwahwa","Nyi kuthu takanyisa eswe","Mapwa ha shimbu yaluvundo","Nyi mwaso wa chiseke."]},{"t":"v","n":3,"l":["Ku miteto, kupinda, nyi missongo","Lamba muchifuchi chino","Miaso yineza kuli yetu","Tununu no kanayi","Mbunga yinazwele hakachi","Kevile ndo liji lia zango,","Holenu, afu, ndombo hano,","Chilamwina hasemuka."]}]},{"n":240,"ti":"Chishima cha mavungu","b":[{"t":"v","n":1,"l":["Tuli nyi chimwe chishima cha","Mavungu","Chishima cha to nyi sambukila;","Mu milima wangwendesele","Yoze musono Soma Yesu","Yoze musono Soma Yesu"]},{"t":"c","l":["Chochene milima hiyapwa chimene","Amu tangwa hilia temuka","Chenacho, Kristu mahinga hano","Mu wanangana wa pangu nyi zango"]},{"t":"v","n":2,"l":["Tuli nyi miaso yipema ya mavungu","Nyi kwakungulwila kuli Mwene","Nyi kupupa njiza jajita","Nyi mata kakwanongesa"]},{"t":"v","n":3,"l":["Hindu tuli nyi Chilamwina wa","mavungu","nyi lamba hanafu hakulusu","hanga athu eswe","achine milima eze ku pangu","achine milima eze ku pangu."]}]},{"n":241,"ti":"Kulinunga cha mwono","b":[{"t":"v","n":1,"l":["Athu a-ali wanunge a Mwene;","Athu a-ali nyi mbunge nawa já-ali","Hanga akalizangeumwe nyi mukwo.","Ku sambukila, eswe awahilile."]},{"t":"c","l":["Mwene, wahisa kulinunga achi.","Hana chawana nyi kwa wahisa;","Chiseke, ufulielo, kulihana;","A ali wazange miaka yeswe."]},{"t":"v","n":2,"l":["Zuwo likwo nawa lia mwono,","Wa ndako ya ufulielo nyi yitanga","Ya mwono wakuwaha kulinunga nyi","zango","chikwete thachi, kulimbata chipema."]},{"t":"v","n":3,"l":["Mwene, walulieka chiseke","Athu Je atwama hano hashi","Kulinunga chacho cha uwahililo,","Chizavu cha ana Je,","Tuna sakwila, Uhenya!"]}]},{"n":242,"ti":"Ngunazange kuya kuzuwo","b":[{"t":"v","n":1,"l":["Ngunazange nguye kuzuwo","Ngukatwame hamwe nyi mama,","Mupema, kahomboka kakuhanjika","Nyi uthu, nakumuzanga muze","Mahanjika nyi zango,","Kakungunehena chiseke mu mbunge."]},{"t":"c","l":["Hakuheta kuzuwo likulu cho chiseke","Haku twama hakamwihi nyi mwe","mama","chiseke chika mutukevwa nyi mwe","mama","nguka mulweze lie zango liami!"]},{"t":"v","n":2,"l":["Mama hinguna mulilisa matangwa","anji!","Hinguna mumwesa lamba nyi","Yinyengo.","Mba hinanyingika yize angulingilile!","Mungu mwita we ukonekeno."]},{"t":"v","n":3,"l":["Che chiseke mungu kevwa","hakutwama nenyi","Ngukamulweze athu mba aka wahilile;","Nguka muzange mba neye aka wahilile.","Nazanga mama nyi mwiva chiseke."]}]},{"n":243,"ti":"Kutwamina nyi mwono Yesu","b":[{"t":"v","n":1,"l":["Kutwama muli Yesu mwono upema,","Kumuwahila muchifuchi mahuza,","Tayiza linga chize atuma","Jila ya chiseke chamwenemwene."]},{"t":"c","l":["Chilamwina chami mupema","Nguli hane kuli Yena","Hi unalingi chitapo","Hakulusu, hali yetu nyi yami;","Yena wika Mwene wami,","Mungukwaha mbunge yami,","Twama muli yami, a Yesu","Nyi yami muli Yena."]},{"t":"v","n":2,"l":["Kutwama muli Yesu wangufilile,","Wamwene lamba lia kulusu","Zango lize nakumutayiza","Ngumu kaule mungano nyi zango"]},{"t":"v","n":3,"l":["Kutwama nyi Yesu kweswe nguli;","Ngulinge yeswe mamba mujina","Lienyi.","Pundu ku lamba yihungumiona","Ku kulusu chichi kulinyenga."]},{"t":"v","n":4,"l":["Kutwama nyi Yesu Chilamwina","chami","Ngwendele mu pangu lia zango;","Ngutwale anatoko ku ulamwino,","Kupwa nyi mwono we mucheseko."]}]},{"n":244,"ti":"Kusakwila","b":[{"t":"v","n":1,"l":["Muze mungwi uluka zuwo","liami litangu","wo usona mungwiva mu mbunge","yami","nyi yeswe yize hiuna ngulingila yo.","Kuli yena mama mungu sakwila,","Ha ufuku mungu lemba nyi kwita,","Muhela wami mu ulingumba nyi","zango","kulemba che nyi kwimba che","chipema","Chakunguhuzulula ku yikola","Kuli yena mama mungu sakwila","Amama yena zango liami!","Hali yami wevwa lamba linji nyi yikola","Keshika nakuzanga chinji,","Hamuhela mungu susuminya hanga","Nguhole,","Wakwimba miaso yahuhumuka,","Chichi kuvulama unene we unji","Kulemba che chajika.","Kuli yena mama mungu sakwila","A mama zango liami","Hali yami wevwa lamba linji nyi","Yikola","Keshika nakuzanga chinji."]}]},{"n":245,"ti":"Kumilimo ya Tata","b":[{"t":"v","n":1,"l":["Kuwaha ku milimo ya mwe Yesu,","Chiseke ami nawahilila","Ku molu Jenyi nguse ko mwono","Wami","Nyi Yesu nawahilila!"]},{"t":"c","l":["Ku milimo ya Soma","Yawana yami nguhane!","Nguli nyi chiseke, cho kuwaha","Cha Mwanangana."]},{"t":"v","n":2,"l":["Wanuke wami weswe kaunyingika","Chiseke mangu wahisa","Pangu lia Tangwa muchizulie","mungwimba,","ku milimo ya Soma."]},{"t":"v","n":3,"l":["Kuli Yena hinguna lilakenya","Chiseke mangu wahisa","Upite weswe ngu uhane chiseke","Ku milimo ya Soma."]}]},{"n":246,"ti":"Kumbata","b":[{"t":"v","n":1,"l":["Malamwina yoze matayiza liji Lienyi","Kuliwana chipema chazango cha athu Je","Hiwapwa muli akwa kulimbata","Chawana chize chinatela."]},{"t":"v","n":2,"l":["Mu zango lize unendesa eswe","hamwe","mwono wa miaka mu upalika usandu","nyi zango,","kulinunga mu woma wa Zambi."]},{"t":"v","n":3,"l":["Tweya uhinge zuwo lio upwe","Mwanangana","Teulwila mbunge jo ku shimbi Ye","ashishike.","Alamwinenu kuyizezo yo;","Wawahise nawa ku lamba."]}]},{"n":247,"ti":"Kristu haya nyi kululiekela yihela","b":[{"t":"v","n":1,"l":["Kristu halulieka yihela","Mwilu kuzuwo lia Tata,","Kuze haliapwila mutuheta","Kuze shili kuyishiko","Mwe mwilu, mwe mwilu,","Kristu halulieka yihela","Mwe mwilu, mwe mwilu;","Mwilu, kwe kuzuwo lia Tata."]},{"t":"v","n":2,"l":["Kumutukapwa ko nyi Yesu,","Nyi zango Lienyi lia miaka yeswe,","Ku mazuwo waze apangu","Ku sambukila ya Mwene wetu","Mwe mwilu, mwe mwilu,","Ku mu