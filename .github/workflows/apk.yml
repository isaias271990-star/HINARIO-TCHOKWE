name: Gerar Aplicativo e APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Criar ZIP Offline
        run: |
          mkdir -p pacote_offline
          cp -f index.html pacote_offline/ 2>/dev/null || true
          cp -f hinos.json pacote_offline/ 2>/dev/null || true
          cp -f logo.png pacote_offline/ 2>/dev/null || true
          cp -f manifest.json pacote_offline/ 2>/dev/null || true
          cd pacote_offline
          zip -r ../Hinario-Tchokwe-Offline.zip ./*
          cd ..

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-ZIP
          path: Hinario-Tchokwe-Offline.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK
        run: |
          if [ -d "hinario-app" ]; then
            cd hinario-app
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug || gradle assembleDebug || true
          fi
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/Hinario-Tchokwe.apk \; || true

      - name: Disponibilizar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-APK
          path: |
            Hinario-Tchokwe.apk
            **/build/outputs/apk/debug/*.apk
