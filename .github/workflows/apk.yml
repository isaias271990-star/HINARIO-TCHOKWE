name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Posicionar Arquivos Web e Compilar
        run: |
          # 1. Renomear aplicativo para app se necessario
          if [ -d "aplicativo" ] && [ ! -d "app" ]; then
            mv aplicativo app
          fi

          # 2. Renomear Ativos para assets se necessario
          if [ -d "app/src/main/Ativos" ] && [ ! -d "app/src/main/assets" ]; then
            mv app/src/main/Ativos app/src/main/assets
          fi

          # 3. Copiar index.html, style.css e app.js para a raiz de assets
          find app/src/main/assets -maxdepth 2 -name "index.html" -exec cp {} app/src/main/assets/index.html \;
          find app/src/main/assets -maxdepth 2 -name "style.css" -exec cp {} app/src/main/assets/style.css \;
          find app/src/main/assets -maxdepth 2 -name "app.js" -exec cp {} app/src/main/assets/app.js \;

          # 4. Garantir hinos.json em data e dados
          mkdir -p app/src/main/assets/data
          mkdir -p app/src/main/assets/dados
          HINOS_SRC=$(find app/src/main/assets -iname "*hinos*.json" | head -n 1)
          if [ -n "$HINOS_SRC" ]; then
            cp "$HINOS_SRC" app/src/main/assets/data/hinos.json
            cp "$HINOS_SRC" app/src/main/assets/dados/hinos.json
            cp "$HINOS_SRC" app/src/main/assets/hinos.json
          fi

          # 5. Listar para confirmacao visual no log
          echo "=== ARQUIVOS EM ASSETS ==="
          ls -la app/src/main/assets/

          # 6. Compilar APK com Gradle 8.7
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-IASD
          path: '**/build/outputs/apk/debug/*.apk'
