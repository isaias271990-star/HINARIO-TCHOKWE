e,","Vumbi ha zango Lie."]}]},{"n":56,"ti":"Manyinga wika","b":[{"t":"v","n":1,"l":["Yiya mangu lamwina?","Kristu wamwangine manyinga.","Kuli mungu sanyina?","Ndo manyinga Jenyi wika."]},{"t":"c","l":["Ayo sambukila!","Hakulusu Lienyi.","Yesu mangwaha yo","Ha manyinga Jenyi alemu."]},{"t":"v","n":2,"l":["Nguli nyi ulamwino?","Manyinga Jenyi alemu;","Zambi makonekena,","Ha manyinga waze alemu."]},{"t":"v","n":3,"l":["Nyi sambukila Yenyi","Manyinga Jenyi alemu;","Zambi makonekena,","Manyinga jacho alemu."]},{"t":"v","n":4,"l":["Ku makangu sambisa","Manyinga akwete ulemu,","Maneha sambukila.","Manyinga jacho alemu."]},{"t":"v","n":5,"l":["Mwilu mungu kanjila,","Ha manyinga Jenyi alemu,","Mungukaku halisa,","Manyinga Jenyi alemu."]}]},{"n":57,"ti":"Yesu mangukula","b":[{"t":"v","n":1,"l":["Yesu yangukula nyi manyinga!","Ami mungu kamwimbila","Yangu kula te kuchatele,","Nyi che chawana chinene"]},{"t":"c","l":["Yangu kula, hakulusu yangukula Yesu;","Yangu kula, ngunendela hapwila um pangu"]},{"t":"v","n":2,"l":["yangu kula Yesu chawana!","Chiseke chacho chahiana!","Pangu lina katuka mwuilu","Munguka zala nalio tho."]},{"t":"v","n":3,"l":["Ngu shinginyeke kama Mwene,","Ha mwalwa, ufuku nyi hakupomba,","Chazangile kama kuhola,","Ha chawana Che mungwimba."]},{"t":"v","n":4,"l":["Mungu kamona uhenya we,","Mwanangana wa chiyulo;","Masongwela je ngano jami","Mangusa mwaso mukanwa"]}]},{"n":58,"ti":"Kuli Yesu chichi kahona","b":[{"t":"v","n":1,"l":["Lie liji lia Yesu","Nguli mukwa shili","Natayiza mu mbunge","Yesu, mwe Chilamwina."]},{"t":"c","l":["Ye shili yami,","Hi unayifwete,","Ha kulusu chawana,","Yesu yangulamwina."]},{"t":"v","n":2,"l":["Hi nguli mungunu ko;","Wana-angu tuswile.","Mikuli yami yeswe,","Mwene hana yifwete."]},{"t":"v","n":3,"l":["Sambukila ya Yesu,","Chiseke nyi keke;","Chichi kahona chimwe,","Shimbu nguli nyi Yesu"]}]},{"n":59,"ti":"Chize haze nawanyine ukonekeno","b":[{"t":"v","n":1,"l":["Nguli nyi mwaso nazanga","Hangu konekena","Wa kasendo Chilamwina,","Hangu konekena."]},{"t":"c","l":["Hangu konekena","Hanangu lamwina, hanangu lamwina.","Hana ngulamwina, mungo halisa Yesu.","Hangu konekena, hanangu lamwina.","A afumane Chilamwina."]},{"t":"v","n":2,"l":["Kristu kakungu wahisa,","Hana ngulamwina,","Ngulinge upale wenyi","Hangu konekena."]},{"t":"v","n":3,"l":["Nguli nyi uwahililo,","Hangu konekena","Hana ngu mwangina manyinga","Hangu konekena."]},{"t":"v","n":4,"l":["Nguli nyi zuwo mwilu","Hangu konekena","Miaka yeswe ngukatwame mo","Hangu konekena."]}]},{"n":60,"ti":"Liwe lia miaka","b":[{"t":"v","n":1,"l":["Mwe Yesu hamutondo","Haze wangu fwilile,","Wahichile manyinga","Angukose ku-upi wami","Ngukonekene kama","Chiseke nyi ulamwino."]},{"t":"v","n":2,"l":["Chipwe hi yitanga ko,","Mukwa shili masamba.","Ndo wika Yena Yesu,","Munwaha mwono nyi pangu;","Ngukonekene Mwene,","Ngujikijile zango Lie."]},{"t":"v","n":3,"l":["Chipwe kufwa muchiza,","Cha mwono wacho, uno;","Muze Munguya mwilu,","Nguka mone huma Lie;","Liwe lia miaka yeswe,","Muli Yena ngutwame."]}]},{"n":61,"ti":"Manyinga Jenyi unene akwete","b":[{"t":"v","n":1,"l":["kuna zange kupuluka ku shili?","Manyinga Jenyi ulemu akwete,","Nyi unazange kuhichika Liapu?","Manyinga unene akwete."]},{"t":"c","l":["Manyinga Je thachi akwete","Ndo manyinga ja Yesu","Kuli unene a mukwa shili!","Taiza kuli Yesu"]},{"t":"v","n":2,"l":["Kuwazanga che kulengumuka?","Manyinga Jenyi thachi akwete","Upi nyi lamba kuwayi zanga?","Manyinga Jenyi alemu."]},{"t":"v","n":3,"l":["Kuwazanga kutomesa mbunge ye?","Manyinga Jenyi thachi akwete;","Machiza ko yipeka ye yeswe?","Manyinga tchachi akwete."]},{"t":"v","n":4,"l":["Una zange milimo ya Soma?","Manyinga Jenyi thachi akwete;","Wazanga kupwa mukweze Wenyi?","Manyinga unene akwete."]}]},{"n":62,"ti":"Yesu meza hapwila","b":[{"t":"v","n":1,"l":["Akweze ja Zambi shikenu yitavwi;","Yesu hapwila meza;","Twalenu maliji yifuchi yeswe;","Yesu kumeza nawa."]},{"t":"c","l":["Ku makeza!","Ku makeza!","Yesu hapwila meza!"]},{"t":"v","n":2,"l":["Akwa ufulielo ambujolenu;","Yesu hapwila meza!","Sakwilenu, nyi chiseke, yimbenu;","Yesu hapwila meza."]},{"t":"v","n":3,"l":["Milundu nyi mihwahwa yikolojoke","Yesu ku meza nawa!","Makimba-a kalunga embenu miaso","Yesu ku meza nawa!"]},{"t":"v","n":4,"l":["Jita nyi zala tunayi mono,","Yesu hapwila meza!","Ye yikomokeso tunayi mono;","Yesu hapwila meza."]}]},{"n":63,"ti":"Mwene nyi kawashi meza","b":[{"t":"v","n":1,"l":["Yifuchi yeswe hamona yilayi,","Yina tulweze kwiza cha kristu;","Enwe ngeji januhwa nyi kwenda?","Tangwa lia-ulamwino hilia kundama!"]},{"t":"c","l":["Ambujolenu Sango ali!","Kristu kaneza hapwila lume;","Akwa mbunge ja zango lembenu;","Kaneza kawashi, Mwene Chilamwina!"]},{"t":"v","n":2,"l":["Ye yilayi hana yisoneka","Yina tulweze tangwa muliza;","Athu to nyi mwongo wamilima;","Amwe kana lezumuka nyi woma."]},{"t":"v","n":3,"l":["Zambi hambulwila akwa ufuleilo","Kuli thachika chenu muchihwa;","Nukapwe nyi zango mu mambunge,","Lia waze azanga tangwa lipema."]},{"t":"v","n":4,"l":["Tupwenu nawa nyi thachi jikwo,","Mumu tangwa kulishi kusuku,","Yesu mejila akwa kushishika","Akaye no mwe muchifuchi cha miaka."]}]},{"n":64,"ti":"Mwanangana ku meza","b":[{"t":"v","n":1,"l":["Mwanangana ha kundama,","Wafwilile ha kulusu;","Mukwa ululi makaya","Hamwe Nenyi mwilu."]},{"t":"c","l":["Haka mwihi he ali,","Mumu Yiye heza ku pito","Kumakeza, kumakeza.","Hapwa lume ku pito."]},{"t":"v","n":2,"l":["Kutuna mono yilayi","Kwiza se hicha kundama,","Eswe waze maka kumba","Makaya nyi Mwene"]},{"t":"v","n":3,"l":["Kanda upwa nyi chiseke,","Jita kumuyi nunga;","Ha kuhiluka cha Yesu,","Yeswe, muyi kahwa."]},{"t":"v","n":4,"l":["Zuwo lietu mulikapwa,","Muchifuchi chize chaha;","Kufwa kuchichi kanjila,","Yeswe yichi kahwa"]}]},{"n":65,"ti":"Tangwa chalinyingikine","b":[{"t":"v","n":1,"l":["Lie tangwa liaku hiluka ndungwi, kwiji,","Yilayi wika yangu vwisa kuwaha,","Haliapwa muchiza kusula cha hashi,","Halie tangwa kwiji."]},{"t":"c","l":["Makeza etu tulayilile;","Makeza aleluya! Aleluya!","Ha malelwa meza nyi angelo mu uhenya,","Mba lie tangwa kwiji."]},{"t":"v","n":2,"l":["Ye yisoneko, mamona akwa-ufulielo,","Ngwo we uwahiso wetu himu wiza,","Tutalenu we uhenya mu-ukeza,","Mba lie tangwa kwiji."]},{"t":"v","n":3,"l":["Kulemba nyi kulayilila, chinate,","Tu shimbwi shilenu mu pangu lipema;","Muthuka hwima mulimbo lipema","Mba lie tangwa kwiji."]}]},{"n":66,"ti":"Kristu meza Aleluya","b":[{"t":"v","n":1,"l":["Chimene nyi haku thuhuka cha tangwa,","Pangu muli katemwina mumilima,","Kristu makeza angelo mu-henya.","Kristu maka tambula nyi-Enyi."]},{"t":"c","l":["Mwene, Yesu, Chilamwina","Shimbu lika-mutwimba:","Hiluka kristu, aleluya!","Aleluya, Amem! Aleluya, Amem!"]},{"t":"v","n":2,"l":["Chimene, nyi muchikapwa; chingoloshi?","Nyi hanji nawa mukachi ka ufuku,","Pangu muli kalumuka lia uhenya","Muze Kristu matambula nyi-Enyi."]},{"t":"v","n":3,"l":["Cho kuwaha chinji! Hakukumba che kufwa,","Yesu maka twaha mwono ku-ushi kuhwa","Eswe tukaye kuzuwo lia uhenya","Mwe muzuwo Yesu analulieka."]}]},{"n":67,"ti":"Yesu meza","b":[{"t":"v","n":1,"l":["Talenu, akwa ufulielo,","Mumu kusula chineza;","Ndeya jenu jitemuke","Hindukenu nyi kawashi."]},{"t":"c","l":["Yo meza, Kristu meza!","Meza ahinge nyi uhenya,","Nyi akwa usandu hakukumba,","Ku meza, Kristu meza"]},{"t":"v","n":2,"l":["Yesu hana lilakenya","Ukonekeno nyi chawana,","Uzalo nyi yipangula","Lwezenu mavungu eswe!"]},{"t":"v","n":3,"l":["Te minyiko kuma soma;","Lwezenu Chifuchi cheswe","Ngwo yesu hapwila meza,","Zango linji ali nalio."]},{"t":"v","n":4,"l":["Akwa shili eswe tweyenu,","Kristu mapwa hako lienu;","Tweyenu ye shimbu yino,","Tweyenu Zambi manwita!"]}]},{"n":68,"ti":"Hamene uhenya","b":[{"t":"v","n":1,"l":["Hamene uhenya muze mu mukucha!","Soma makeza","Athu jenyi muchifuchi cha miaka!","Aye makeza."]},{"t":"c","l":["Hamene uhenya muze mukucha.","Pangu ku mulikeza!","Hamene uhenya muze mukucha.","Yesu kaneza"]},{"t":"v","n":2,"l":["Hindu tunevu maliji a miaka,","Kanda nulaluka!","Kumeza nyi uhenya uze wahiana,","Mwe Kristu Mwene"]},{"t":"v","n":3,"l":["Nyi angelo mu-uhenya uze wahiana","Kristu, Ngaji, meza!","Mavungu, minyachi, liluliekenu,","Kechi kushimbula."]},{"t":"v","n":4,"l":["Tuka mone waze afwile khulu,","Tuka linunge no!","Kushi kufwa, kulila chipwe yikola,","Ku Chifuchi chetu."]}]},{"n":69,"ti":"Kwilu hikwacha","b":[{"t":"v","n":1,"l":["Hilia kundama tangwa lia Kristu","Ngunevu mangu sanyika;","Ngwo tala kwilu hikwacha,","Tenu pangu Lienyi himuliza"]},{"t":"c","l":["Chochene kwilu himu kucha-a!","Chochene kwilu himu kucha-a!","Ufuku mu-uchina, mwalwa ku-uneza,","Chochene kucha hicha kundama!"]},{"t":"v","n":2,"l":["Yilayi yeswe yiya palika,","Hashi mwilu mukalunga,","Talenu kwilu hikwacha,","Kwiza cha Kristu hicha kundama."]},{"t":"v","n":3,"l":["Laulenu haliapwa hikwacha,","Kulizelula chimbilenu,","Nutemwine pangu hashi,","Pwenu thethekeli ja thununu."]},{"t":"v","n":4,"l":["Yenu hanga nuka kolojoke","Hashi, mwilu nyi mukalunga,","Yilema, tupuputa, kwalakenya,","Ku chiwanyino chinene cha zambi"]}]},{"n":70,"ti":"Uhenya! Aleluya! Kristu meza","b":[{"t":"v","n":1,"l":["Aleluya, Kristu meza!","Tumu tambulenu","Nyi athu eswe aliho,","Tambulenu Mwanangana","Swanyisenu Soma,","Swanyisenu Soma,","Mwe Yesu, Mwanangana Yiye Soma."]},{"t":"v","n":2,"l":["Aleluya, meza ahinge","Kana Muswanyisa,","Ku milundu , nyi muyilombo,","Ku mbunga ja athu,","Ku mbunga ja athu,","Mwe Soma Yiye,","Mwanangana wayifuchi."]},{"t":"v","n":3,"l":["Shili nyi yikola, kuyishiko,","Chipwe missongo kha;","Se yesu mwe mwanangana,","Matwaha yeswe twafupa,","Mu pangu lia zango…","Mu pangu lia zango…","Lie zango, zango lia Tata wa mwilu."]},{"t":"v","n":4,"l":["Ku makeza hanga ahinge,","Tu wahililenu,","Ululi nyi sambukila,","Maka twaha uwahiso,","Tulamwine kama..,","Tulamwine kama..,","Wa miaka, hanga tuka lindujoke."]}]},{"n":71,"ti":"Muze Mwanangana makeza","b":[{"t":"v","n":1,"l":["Yesu kana lulieka kulia,","Kashishika nyi kulakenyia;","Mba kuchi yena nyi yami?","Hakwiza cha soma?"]},{"t":"c","l":["Muze soma meza ndumbwami,","Muze soma makeza.","Mba kuchi yena nyi yami,","Hakwiza cha soma?"]},{"t":"v","n":2,"l":["Yoze wa twama mu lie pangu,","Watufwilile hákulusu;","Anenyi makaya no mwilu,","Muze aye meza."]},{"t":"v","n":3,"l":["Makatambula ana jenyi,","Maka-ajika uzalo utoma;","Muykapwa ola yetu yipema","Hakwiza cha soma."]},{"t":"v","n":4,"l":["Kumaka handununa ko akwo","Waze keshi ulamwino;","Makalila chimwe chahiana;","Hakwiza cha soma."]}]},{"n":72,"ti":"Kukuchi kapwa nawa milima","b":[{"t":"v","n":1,"l":["Yesu kechi keza ufuku kha","Yesu kechi keza ufuku kha","Yesu kechi keza ufuku kha","Akejile anenyi.","WTAWIZO","Akejile anenyi","Akejile anenyi","Yesu kechi keza ufuku kha","Akejile anenyi."]},{"t":"v","n":2,"l":["Nyi yikolo kuyichi kapwa ko","Nyi yikolo kuyichi kapwako","Kuwaha wika ha kwiza chenyi","Akejile anenyi."]},{"t":"v","n":3,"l":["Kulila ako kuchichi kapwa","Kulila ako kuchichi kapwa","Kulembejeka muchikapwa ko","Akejile anenyi"]},{"t":"v","n":4,"l":["Mutu kamu halisa ha kwiza","Mutu kamu halisa ha kwiza","Chiseke chinji muze makeza","Akejile anenyi."]}]},{"n":73,"ti":"Yesu kaneza hakumba","b":[{"t":"v","n":1,"l":["Hakumba kana mutwala","Ye yizavu ya angelo.","Yesu majinga Chifuchi","Nyi lelwa lia kukumba,","Aleluya! Meza nyi kutumina","Aleluya! Meza nyi kutumina"]},{"t":"v","n":2,"l":["Uhenya wenyi, wahiana,","Eswe mutu kaumona,","Lamba kuli akwa shili","Waze amushihile","Tungumuku makamumona yo meza!","Tungumuku makamumona yo meza!"]},{"t":"v","n":3,"l":["Muze hashi muhachikima;","Yizenge malimbwoka","Mukwa shili malezumuka","Haze hambozo yenyi","Ha usoma Wenyi Kristu meza asopese!","Ha usoma Wenyi Kristo mesa asopese!"]},{"t":"v","n":4,"l":["Vumbi uhenya, kusakwila","Kuli Soma ya Mwilu!","Tambula Usoma, solola","Kuhisa Che a Zambi!","Mu Usoma We, Mwene Yesu uhinge!","Mu Usoma We, Mwene Yesu uhinge!"]}]},{"n":74,"ti":"Kristu kanakusanyika","b":[{"t":"v","n":1,"l":["Kristu maku sanyika nyi zango;","Mukwa shili tweya kuli Yiye!","Kanda wivwa woma umuchine,","Lihane kuli Yesu!"]},{"t":"c","l":["Mukwa shili, Yesu au","Tweya ute, Chilamwina kana sanyika!"]},{"t":"v","n":2,"l":["Kristu kana kusanyika uhwime;","Mukwa shili tweya kuli Yiye!","Chilemo che machitepulula","Yesu makutambula!"]},{"t":"v","n":3,"l":["Tweya Kristu, makukonekena;","Mukwa shili tweya ute!","Yeswe alingile akulamwine","Tweya Yesu akulamwine!"]},{"t":"v","n":4,"l":["Kristu kana kusanyika nawa;","Mukwa shili tweya ute!","Tambuka ko hanga ulihane","Kanda ukokoloka."]}]},{"n":75,"ti":"Chihomboloji","b":[{"t":"v","n":1,"l":["Nyi uhomboloji Yesu masanyika","Yena nawa nyi yami,","Tala se pito lichili lia washi,","Hali yena nyi yami."]},{"t":"c","l":["Tweya, tweya, a,a!","Yena jinakuhu tweya a!","Chihomboloji Yesu masanyika;","Yena: “Chivulumunyi”!"]},{"t":"v","n":2,"l":["Yika tuna manyina? Yesu ngwenyi,","Tweya yena nyi yami.","Kanda usaula makwaha mwono,","Mahana yena nyi yami"]},{"t":"v","n":3,"l":["Shimbu yinayi mathangwa kanahu,","Hali yena nyi yami,","Lamba nyi ufwe yatuzulamina,","Mwe yena nyi yami"]},{"t":"v","n":4,"l":["Zango linene Yesu atuhele","Kuli yena nyi yami,","Heneza atulamwine ku shili,","Wejile hali yetu."]}]},{"n":76,"ti":"Mbunge hiyalaula","b":[{"t":"v","n":1,"l":["Mbunge hayi lawisa-a","Yesu kuma lamwina;","Etu eswe kutuna kwichi","Kristu utulamwine."]},{"t":"c","l":["Kasendo, tweya nyi,","Lihane kuli Yesu!","Kasendo, tweya, nyi,","Aye makulamwina!"]},{"t":"v","n":2,"l":["Kuzwela mba hichawa,","Cha sonyi nyi kutoka.","Kushishika, nyi zango","Mwene makulamwina,"]},{"t":"v","n":3,"l":["Ya hashi nyi chechimwe","Yichi kakulamwina","Yesu wika makwaha","Ulamwino nyi zango"]},{"t":"v","n":4,"l":["Kasendo kanda ushimbula","Tayiza kuli Yesu,","Muli Yiye mukawana mo","Mwono wa sambukila."]}]},{"n":77,"ti":"Mweswawo hevwa maliji","b":[{"t":"v","n":1,"l":["Mweswawo hevwako, a-ambujole;","Kutambula wa wana ulamwino.","Hanga Chifuchi cheswe chivwe maliji;","Mweswe mazanga eze!"]},{"t":"c","l":["Mweswe mazanga! Eze atambule!","Eswe hanga evwe maliji apema","Mwe Tata wa mwilu unatu sayika;","Mweswe mazanga eze!"]},{"t":"v","n":2,"l":["Mweswawo hevwako eze atayize;","Pito lichili liawashi njilenu;","Yesu ye jila manutwala mwilu;","Mweswe mazanga eze"]},{"t":"v","n":3,"l":["Chilakenyo chipema a mukwa shili;","Unazange mwono? Tweya kuli Yesu;","Nyi kuzanga chinji kanatulweze.","Mweswe mazanga eze!"]}]},{"n":78,"ti":"Wanguzanga yami chivulumunyi","b":[{"t":"v","n":1,"l":["Mwono pajika Mwene;","Yesu mwe Chilamwina;","Kana kwambe nyi zango;","Ami kuwangu Zanga?","Yami nakujitwile,","Naukile yilonda ye;","Nakatukile mwilu.","Amukwa-shili wanguzanga?"]},{"t":"v","n":2,"l":["Uhenya-Wami mukamona,","Mukalia ye yawana,","Mwono mungu kakwaha,","Chichi kakuhichika.","Mwene nguna linyenge","Mumu chishi nyi zango;","Ngwalumune a Yesu,","Ngupwe –nyi zango lia Yena."]}]},{"n":79,"ti":"Ngukaule! tweyaungukaule","b":[{"t":"v","n":1,"l":["Panjika liji lia Yesu;","Ngu kaule kaula!","Mungu kutwala ku pangu;","Ngu kaule kaula!","Nakuhetesele shimbi;","Nakunwina yize yisasu;","Nakufwilile nyi lamba;","Ngukaule kaula."]},{"t":"v","n":2,"l":["Naku tusula ku shili,","Ngukaule, ngukaule!","Mwilu mungu kusongwela,","Ngukaule, kaula!","Nakuku sanyika chinji,","Kuwafungile shimbi Jami","Hinguna kupwila chela;","Ngukaule kaule"]},{"t":"v","n":3,"l":["Makahwimina hali Yami;","Ngukaule, kaula;","Tweya unehe shili ye;","Ngukaule kaula!","Nguli Zambi, Chilamwina","Nakuzanga mukwa shili,","Hichika woma we weswe","Ngukaule,kaula."]},{"t":"v","n":4,"l":["Yesu, munguku kaula,","Ngukaule, kaula!","Munguka hichika yeswe,","Nguhichike, hichika,","Nguli mulelu liakulu,","Chichi kuhasa kwenda kha;","Nguzalise nyi thachi Je,","Ngukaule, kaula."]}]},{"n":80,"ti":"Mweche anjile","b":[{"t":"v","n":1,"l":["Kristu yeu kupito,","Munjise;","Mwazulwile anjile,","Munjise;","Kuma kukonekena,","Sambukila makwaha,","Kachi kakuhichika","Munjise"]},{"t":"v","n":2,"l":["Mwazulwile mbunge ye,","Munjise;","Kanda ukokoloka,","Munjise;","Makapwa kasendo ke","Ku yipi akufunge,","Yiye makupulwila,","Munjise"]},{"t":"v","n":3,"l":["kanda umu manyisa,","Munjise;","Nyi kha makuhichika;","Munjise;","Nyi kha yikola mwivwa;","Kechi kakwivwa nawa;","Nyi kha mulitokela.","Munjise."]}]},{"n":81,"ti":"Pito liawashi","b":[{"t":"v","n":1,"l":["Kana twazulwila pito","Lia kuzuwo lia mwilu;","Kristu kumatutayiza","Tunjile hitwakumba."]},{"t":"c","l":["Keke ya Yesu yahiana","Lie pito yangwazulwila!","Yami, yami;","Hana ngwazulwila."]},{"t":"v","n":2,"l":["Mukwa shili nyi muzanga,","Pito hakwazulwila!","Mwilu mukapwa nyi zuwo","Lize Kristu makwaha"]},{"t":"v","n":3,"l":["Akwa shili eswe tweyenu,","Kanda nukokoloka,","Nyi kha shimbu muyipalika,","Ola ya ulamwino."]}]},{"n":82,"ti":"Kuli Yesu nyi chimwe","b":[{"t":"v","n":1,"l":["Mbunge ye yinazala,","Kushi chihela cha Yesu?","Nyi kushi ufulielo,","Waku kaula Yesu?","Hanakufwila hakulusu,","Hindu kana ngongwela,","Laula mukwa thulo,","Ukaule mwe Yesu."]},{"t":"v","n":2,"l":["Unenyeka shimbu ye,","Ku-ushi chuma cha Yesu?","Unenyeka mbongo je,","Ku-ushi chuma cha Yesu","Una zange mu pangu?","Umu fumbwile akwenu?","Tweya ukilikite,","Ukaule mwe Yesu."]},{"t":"v","n":3,"l":["Yipi una kaula,","Uhichike mwe Yesu?","Yiye wa miaka yeswe,","Upihise kulusu.","Tweya tambula pangu,","Tambula zango Lienyi?","Tayiza kuli Chilamwina,","Mba ukamone Yesu."]},{"t":"v","n":4,"l":["Mafwo a mokomoko,","Mihuko ya Yesu mba?","Mutondo ku-ushi thachi,","Ye milima wazanga","Mba thachi ja kulusu,","Fuliela zango lia zambi","Wivwe kuwaha cha mwilu","Mba ukamone Yesu"]}]},{"n":83,"ti":"Yiya uli kusali lia Mwene","b":[{"t":"v","n":1,"l":["Unazange upwe kuli Mwene?","Nyi ku-unazange Satana?"]},{"t":"c","l":["Mosono tongola kusali lika unazange?","Musono tongola:","Kutoka hanji nyi kumwono."]},{"t":"v","n":2,"l":["Tununu hindu ali mushili,","Kanatalikisa ku ufwe."]},{"t":"v","n":3,"l":["Tweyenu kusali lia Mwene Yesu,","Munuwana ulamwino, nyi sambukila."]}]},{"n":84,"ti":"Lwano umuwika","b":[{"t":"v","n":1,"l":["Ayema maliji ha mwe Yesu,","Masanyika nyi zango,","Nyi kuzazulula moko kanambe,","Tweya kuli Chilamwina!"]},{"t":"c","l":["Kristu kasanyika angulamwine,","Shimbu yimuwika, ufulielo!","Mungu lisa kuchitamba Che,","Ungutayize a Kristu."]},{"t":"v","n":2,"l":["Shili ye yinji kuwahonga!","Makwonga mukwa yizezo.","Hinalinga yeswe liji linambe","Fuliela Chilamwina!"]},{"t":"v","n":3,"l":["Nguna lele namba kulimbuka;","Nguna khakajana.","Chichi kwivwa woma, mumu lia Kristu:","Kechi kangwehuka."]},{"t":"v","n":4,"l":["Chifuchi cha mahuza, chinatoko;","We mwalwa wamahuza,","Sambukila, mwono zango anangwehe;","Nguli wa Yesu mu mbunge."]}]},{"n":85,"ti":"Kuli yena nguneza a Mwene","b":[{"t":"v","n":1,"l":["Napwile nyi chinyengo mu mwono,","Kusuku nyi Chilamwina chami;","Sambukila nyi ukonekeno,","Kuli Yena Mwene.","Kulithachika nyi yeseko,","Lamba nyi luyinda namwene;","Kujikiza mu mbunge yami,","Mwene kungu neza."]},{"t":"v","n":2,"l":["Kulengumuka mungu chimbila,","Kusuku a Chilamwina;","Nguna zange zango lia Yena,","Ngulingile Mwene.","Zango lia Yena kuliahiana","Kunguna wahilila nalio,","Nguna zange tutwame hamwe;","Hanga ngupwe nyi we."]},{"t":"v","n":3,"l":["Chishi woma wakufwa nawa,","Se hamwe tuli nyi Yena;","Ngunazange tukapwe hamwe.","Uka ngutambule.","Nguna zange kupwa nyi Yena,","Hamwe nyi Yena ngwase jita,","Nguka kumbe nyi hanji kufwa;","Kristu Chilamwina."]}]},{"n":86,"ti":"Nguhilukile kuzuwo","b":[{"t":"v","n":1,"l":["Kusuku nguli nyi Mwene","Nguye ku zuwo;","Ngunende mu majila api;","Nguhiluke a Zambi."]},{"t":"c","l":["Munguya kuzuwo,","Nalungajala,","Ngu kwate nyi kwoko Lie;","Ngwize a Mwene."]},{"t":"v","n":2,"l":["Ngunenyeka shimbu yami,","Nguye ku zuwo;","Chipi kwenyeka je shimbi;","Ngwize a Zambi."]},{"t":"v","n":3,"l":["Hijanguhwa shili nyi lamba,","Nguye kuzuwo;","Nguna fuliela zango Lie;","Nwize a Zambi."]},{"t":"v","n":4,"l":["Manyinga Je mangu tomesa;","Nguye kuzuwo;","Ngutomese tho ngwe mbundu;","Ngwize a Mwene."]}]},{"n":87,"ti":"Kukaula Yesu","b":[{"t":"v","n":1,"l":["Yesu mungu mukaula,","Chipwe kuyuka yeswe;","Kuze Longeshi makaya","Ngukaule woma kha."]},{"t":"c","l":["Yesu nguna ku kaula,","Yena wangu fwilile","Chipwe eswe, makuchina","Hindu mungu kukaula."]},{"t":"v","n":2,"l":["Chipwe jila muyikala,","Nyi milima yahiana:","Ena wayipalikile","Ungu kwate ku kwoko."]},{"t":"v","n":3,"l":["Nyimungu mona lamba,","Yizezo muyingwoka,","Chipwe Yena akuzezele","Wamwene lamba linji"]},{"t":"v","n":4,"l":["Nyi muzanga kungu twala","Muphuya ya chinyengo","Chipwe Yena wayile mo","Ngu kaule nyi ngano."]},{"t":"v","n":5,"l":["Nyi Yena ku-unazange","Ngu zauke mwe yordau","Yesu, wamuzaukile","ngu kaule nyi hamu."]}]},{"n":88,"ti":"Nyi Kristu maya nyi yami","b":[{"t":"v","n":1,"l":["Muyihela ya khole munguka palika;","Nyi milundu yisuku nguye nyi kuwaha;","Kunguna jikiza muchihuhumuke;","Ngwendele mu pangu, hamwe nyi Yesu."]},{"t":"c","l":["Kweswako hindu mutuya, nyi Yesu","Ngufunge shimbi, mwilu ngukaye;","Hamwe Nenyi.","Lie zango liami ngumbate lie kulusu;","Kweswako hindu Munguya nyi Yesu."]},{"t":"v","n":2,"l":["Chipwe meya a mwono,","Nguwambachile Yoze","Nyi kachi muzanga mungu","Kulongesa,","Nyi mungu songwela nguye nyi Yesu"]},{"t":"v","n":3,"l":["Chipwe kunyonga chami numbate kulusu","Ayo kana linyenge mumu ha shili yo;","Ami ngufuliele ngumwononoke","Yeswayo mangwamba nguye nyi Yesu."]},{"t":"v","n":4,"l":["Yeswe Kristu mangwamba chichi","Kukolema,","Mungu mukaula kweswe masongwela","Nguye kweswe mamba nyi chiseke chinji","Shimbu yeswe nyi yami nguli nyi Yesu."]}]},{"n":89,"ti":"Sango lia kulusu","b":[{"t":"v","n":1,"l":["Yajika kulusu ha mulundu umwe,","Chinyingi cha sonyi nyi lamba;","Nazanga kulusu, henaho mwe Yesu,","Afwilile ha shili yami."]},{"t":"c","l":["Nazanga sango lia kulusu;","Nguliambujole ndo kukufwa,","Ngumbate lie kulusu liami","Mba ngutambule chipangula."]},{"t":"v","n":2,"l":["Yahichika uhenya","Mwana-Phanga wa Zambi","Ha ngongota yamona lamba","Hakulusu liacho nguna wahilila","Henaho angulamwinyine."]},{"t":"v","n":3,"l":["Lie lamba amwene kusongo mba yafwa","Yesu hanga angukonekene","Hakulusu Lienyi ngunawahilila,","Mumu ha ulamwino wami."]},{"t":"v","n":4,"l":["Hamwe nyi mwe Yesu, sonyi ja kulusu","Chipwe nyi lamba ngulimbate.","Aye mangwijila nguye nenyi hamwe.","Kuzuwo Lienyi lia uhenya."]}]},{"n":90,"ti":"Ola yilemu yakulemba","b":[{"t":"v","n":1,"l":["Ola yakulemba te, sambukila mwilu,","Tutalenu mwe Kistu kasendo ketu;","Shimbu yacho yilemu, tuhanjike Nyenyi,","Muyineha je thachi, chinapeme kulemba."]},{"t":"c","l":["Chipema kulemba, kulemba nyi thachi.","Muchineha je thachi!","Chinapeme kulemba"]},{"t":"v","n":2,"l":["Ola yakulemba te, yisongwele mwono,","Ku yinyengo ya mwono ku Molu a Yesu;","Tu mwimbilenu miaso, ngwe","Makimba a kalunga,","Muyineha je thachi, chinapeme kulemba"]},{"t":"v","n":3,"l":["Ola yakulemba te, muze mukua kuzeza","Mamukumba nyi tachi ja chilamwina;","Malilu ma soloka nyi uhenya unji,","Muyineha je tachi chinapeme kulemba."]}]},{"n":91,"ti":"Ngunazange kupwa hakamwihi nyi kulusu","b":[{"t":"v","n":1,"l":["Nguli wa Yena, liji Lie nevwa","Zango lina ngutambieka;","Mwene nguna zange kupwa hehi,","Vulie a Chilamwina!"]},{"t":"c","l":["Haka muihi nyi kulusu Lie,","Nguna zange Chilamwina!","Ngukundame he hakulusu Lie;","Ngumbate Mwene wami."]},{"t":"v","n":2,"l":["Ku nguna lihana kuli Yena,","Ku zango Lie ngu tambule;","Mbunge yami yinawahilila","Mwene nguku lingile."]},{"t":"v","n":3,"l":["Hi kuwaha ko! Chiseke chinji","Kutwama kuyiliato Ye;","Nyi ufulielo wakutakama,","Nguhanjike nyi Mwene."]}]},{"n":92,"ti":"Ngunazange kupwa hakamwihi nyi kulusu","b":[{"t":"v","n":1,"l":["Hehi nyi kulusu Lie","Shima lia upite,","Liolio mulivwelwoka","Mulundu Shiyono."]},{"t":"c","l":["Kulusu, Hakulusu,","Nguna wahilila,","Munguya ngukahwime,","Musali lia lwiji."]},{"t":"v","n":2,"l":["Ha woma wa kulusu,","Chawana cha miaka,","Muthumbu wachimene,","Kanangu temwina."]},{"t":"v","n":3,"l":["Hakulusu Zambi yami,","Hanga ungwi-uluke;","Mushi lia Chilamwina,","Hanga ungusweke."]},{"t":"v","n":4,"l":["Hakulusu nyi ufulielo,","Chishi kwivwa woma;","Nguye Chifuchi chacho,","Mba nguli lamwine."]}]},{"n":93,"ti":"Hehi hakamwihi lume","b":[{"t":"v","n":1,"l":["Longeshi wa mwilu, mwe Yesu,","Ngusongwele hehi nyi kulusu!","Nguna zange sambukila Ye","Yize mungwaha nguyi tambule.","Yize mungwaha nguyi tambule."]},{"t":"v","n":2,"l":["Ngukapwe hehi nyi mwe Kristu,","Chishi nyi chuma ngumu lambule;","Ndo wika mbunge yami yipi,","Kwi-yinyengo ngwite ukonekeno.","Kwi-yinyengo ngwite ukonekeno."]},{"t":"v","n":3,"l":["Hehi nyi Yena Zanbi yami,","Shili yami yimbile kusuku;","Nguhichike yeswe ha zango Lie,","Ngunazange Yesu Chilamwina,","Ngunazange Yesu Chilamwina chami"]},{"t":"v","n":4,"l":["Nuna zange ngupwe hakamwihi,","Ndo mungu heta lume musali","Kuze mungu kapwa nyi Mwene,","Mba ngumu halise ha zango Lie,","Mba ngumu halise ha zango Lie."]}]},{"n":94,"ti":"Kutala","b":[{"t":"v","n":1,"l":["Ha kutala ha kulusu,","Afwilile Soma ya uhenya,","Chiseke cha mwono wa hashi","Ami chachalwile nawa."]},{"t":"v","n":2,"l":["Kandangulisamba, a Zambi yami","Ngu sambile ha ufwe wa Yesu;","Chize nakuzanga chinji","Nguchi hichike, ha zango Lie."]},{"t":"v","n":3,"l":["Talenu! Kulusu lia manyinga,","Shima lia chinyengo nyi zango;","Yikola nyi keke ya Yesu","Mumu lia yami muthu mupi."]},{"t":"v","n":4,"l":["Chifuchi cheswe te nyi chami,","Kachi mungu chaha Yesu;","Mumu hakumba ha kulusu.","Nyi mwono weswe nyi zango."]}]},{"n":95,"ti":"Ngwehe Kristu","b":[{"t":"v","n":1,"l":["Wa chifuchi ngwehe Kristu,","Chiseke chamokomoko;","Soma ya zango lia miaka","Kulishi kwalumuka."]},{"t":"c","l":["Kutanda chize, chisuku,","Ha lie zango lia Yesu!","Kuli Yiye twajikijila","Tukatwame mu pangu."]},{"t":"v","n":2,"l":["Wa chifuchi ngwehe Kristu,","Chikwashi ha lie lamba;","Nyi mungupwa nyi Chilamwina","Ku mangu lembejeka."]},{"t":"v","n":3,"l":["Wa Chifuchi ngwehe Kristu,","Angu sambise Yiye;","Muno mu ungeji nguli","Ngwendele mujila Ye."]},{"t":"v","n":4,"l":["Wa chifuchi ngwehe Yesu,","Ngufuliele kulusu,","Mwene mungu kamumona,","Huma Lienyi mu pangu."]}]},{"n":96,"ti":"Yeswe mungumwaha","b":[{"t":"v","n":1,"l":["Yeswe, Kristu, mungu kwaha,","Yeswe, mungu kwaha yo!","Nyi hamu, nyi kwononoka,","Ngu kaule ndo miaka."]},{"t":"c","l":["Ngu mwehe yeswe! Ngu mwehe yeswe!","Mumu lia Yesu, mupema,","Yeswe ngu kwehe."]},{"t":"v","n":2,"l":["Yeswe, Kristu mungu kwaha,","Mbunge nyi mwono yino!","Nguna likale Chifuchi,","A Yesu, ngu tambule!"]},{"t":"v","n":3,"l":["Yeswe, Kristu, mungu kwaha,","ngupwe mwe nyi We pundu;","Ngononoke ku-upale We,","Ngwe angelo mu malilu."]},{"t":"v","n":4,"l":["Yeswe, Kristu, mungu kwaha,","Nguna mono zango Lie","Alumuna mwono wami","Nyi mbunge yami, a Mwene!"]},{"t":"v","n":5,"l":["Yeswe, Kristu, mungu kwaha,","Cho kuwaha, a Mwene!","Sambukila nyi chiseke!","Uhenya, uhenya Chilamwina!"]}]},{"n":97,"ti":"Chize chene nguli","b":[{"t":"v","n":1,"l":["Chize chene nguli-a Mwene,","Manyinga Je malamwina","A mwanganyine ha shili;","A Chilamwina, Nguneza!"]},{"t":"v","n":2,"l":["Se chishi kutalatala","Ngwalumune mwono wami,","Chawana Che kucha hiana;","A Chilamwina nguneza!"]},{"t":"v","n":3,"l":["Nguna hono chishi thachi,","Tala hakuhona chami","Ha yeswe yize nafupa;","A Chilamwina nguneza!"]},{"t":"v","n":4,"l":["Chize chene ngu tambule;","Kosa kama mbunge yami,","Nyi zango Lie ungu sweke;","A Chilamwina!"]}]},{"n":98,"ti":"Tweyenu","b":[{"t":"v","n":1,"l":["Lino tangwa lia ulamwino,","Tweyenu ngunu tomese;","Nguna nusanyika tweyenu,","Hingu nanufwila,","Tweyenu…"]},{"t":"v","n":2,"l":["Hinguna mwange manyinga,","Lio lamba nakumwenene,","Nguna nusanyika, tweyenu,","Hingu nanufwila","Tweyenu…"]},{"t":"v","n":3,"l":["Mwono nanwaha nyi zango,","Tweyenu kuli Chilamwina!","Ngunanu sanyika tweyenu,","Hingu nanufwila,","Tweyenu…"]},{"t":"v","n":4,"l":["Uhindukilo muwiza,","Jikijila kuli Yami,","Ngunanu sanyika, tweyenu,","Hingu nanufwila,","Tweyenu…"]}]},{"n":99,"ti":"Kulihana mweswe","b":[{"t":"v","n":1,"l":["Tambula Zambi mwono wami,","Nguna kwehe wo Yena Mwene,","Tambula moko jami,","Alinge milimo Ye."]},{"t":"c","l":["Ngukoseuum manyinga a Yesu,","Nguchize a Zambi upi wami,","Zambi, nguli hane kuli Yena","Ngupwe mwe nyi We ndo kumiaka."]},{"t":"v","n":2,"l":["Tambula kupwa chami, Mwene,","Ngulinge chize mutumina,","Tambula liji liami, Zambi,","Shimbu yeswe nguku halise."]},{"t":"v","n":3,"l":["Kanwa liami likapwe","Liato kuhalisa Yena;","Tambula upite wami, Zambi,","Chau zangile nawa."]},{"t":"v","n":4,"l":["Tambula shimbu yami,","Shimbu yeswe nguku Halise;","Tambula mbunge yami","Nguna kwehe yo yeswe."]}]},{"n":100,"ti":"Mweswe nyi we","b":[{"t":"v","n":1,"l":["Ngunazange ngupwe a Chilamwina,","Nguli nyi We, nguli;","Ngufunge shimbi ja Yena","Hano nyi mwilu."]},{"t":"c","l":["Mweswe","Nyi We mweswe","Chenacho nguna zange","Mweswe nyi We mweswe","Lienalio zango liami."]},{"t":"v","n":2,"l":["Yamu Chifuchi nyi che chimwe;","Yesu wika Mwene;","Nguhichike yeswe woma kha","Ngumbate kulusu."]},{"t":"v","n":3,"l":["Nguhichike Chifuchi chino,","Yesu twongu kwase!","Nguna zange kupwa nyi Yena","Ngunjile mwilu."]}]},{"n":101,"ti":"Yeswe kuli Kristu","b":[{"t":"v","n":1,"l":["Kunguna zange kupwa mwe wa Chilamwina;","Kupulula ku yipi","Nguna zange mwono."]},{"t":"c","l":["Ngukapwe mwe wa Kristu,","Yeswe ngu mwehe yo;","Yeswe ya Kristu, yeswe, yeswe","Hanga ngumwehe yo."]},{"t":"v","n":2,"l":["Nguka lingile Kristu","Nguhete kawashi,","Ha sambukila nyi jita,","Ngulinge milimo."]},{"t":"v","n":3,"l":["Nguka twame nyi Kristu,","Ngwendangane Nenyi;","Ku mwono nyi ku ufwe,","Ndo kuheta mwilu."]},{"t":"v","n":4,"l":["A mwene, ngu tambule","Chize chene nguli;","Nguli hane hapwila,","Nguli nyi we Mwene."]}]},{"n":102,"ti":"Kulusu liami","b":[{"t":"v","n":1,"l":["Kulusu anguhele Kristu,","Lilelu kuhiana zango;","Yikola yatuchikimisa,","Yichi kuthuchiza Mwene"]},{"t":"c","l":["Kulusu anguhele kumbata,","Yikola yatuchikimisa,","Yichi kusweka Yesu,","Ngwende mu pangu Lienyi,","Nguka kumbe ndo Mwilu."]},{"t":"v","n":2,"l":["Chifuchi cha lelesa Kristu,","Mahungumiona athu a Yesu.","Ha zango Lienyi nyi keke,","Ngumbate lie kulusu."]},{"t":"v","n":3,"l":["Ngulinge upale wa Kristu,","Shimbu yeswe nguli pundu;","Ngwambujole chishima chipema","Kuwaha nyi sambukila."]}]},{"n":103,"ti":"Kulihana chami","b":[{"t":"v","n":1,"l":["Kristu, Longeshi, nguna zange,","Hanga ngulinge upale We:","Ngwehe je tchachi jakukumba","Ku lamba lieswe mulikeza."]},{"t":"v","n":2,"l":["Kristu, Longeshi, nguna zange,","Hanga nguka tomese mwono;","Ngukwase Kristu, Zambi yami,","Kanda nguhichika jila ya Mwilu."]},{"t":"v","n":3,"l":["Kristu, Longeshi, nguna zange,","Hanga ngukumbe shili yami;","Ngutakamise kwe kujita,","Hanga ngukumbe shimbu yeswe."]}]},{"n":104,"ti":"Tangwa lia chiseke","b":[{"t":"v","n":1,"l":["Tangwa liacho! Cho kuwaha","Kuli Mwene ulamwino;","Sambukila hinayi wana","Yitwame mu mbunge yami."]},{"t":"c","l":["Kuwaha ngunevu","Ha tangwa nalumukine!","Hapwila nguli nyi zango Lie,","Ngujikize nyi sambukila,","Kuwaha! Cho Chiseke!","Chiseke chami nyi Yesu."]},{"t":"v","n":2,"l":["Lisambe, kama, mbunge yami,","Hali Mwana –atwaha Zambi","Mumu Yiye wathukula,","Yatukonekena Mwilu."]},{"t":"v","n":3,"l":["Chilakenyo nguli nacho,","Kumwono nguchihetese,","Tangwa nyi tangwa ngumwimbile","Uhaliso Zambi wahiana."]}]},{"n":105,"ti":"Tweya utupapachise","b":[{"t":"v","n":1,"l":["Two papachise,","Nyi unene We,","Se tuli ana Je,","A Chilamwina!"]},{"t":"c","l":["A Mwene nyi Spiritu","Two papachise,","Tuna kufuliela;","Tweya kawashi!"]},{"t":"v","n":2,"l":["Tuli athu-api,","Etwe tunechi","Ku shili yetu te","Tu konekene."]},{"t":"v","n":3,"l":["Keke ya mwilu","Two utwehe yo","Cheseko chinene","Zambi wahiana."]},{"t":"v","n":4,"l":["ngunevu liji","Lie mumalilu","Muli Yena Mwanami,","Nakuzanga!"]}]},{"n":106,"ti":"Shima lia manyinga","b":[{"t":"v","n":1,"l":["Namona shima lia manyinga","Litoma lia miaka!","Manyinga Yesu a mwangine","Yafwa ha kulusu."]},{"t":"c","l":["Namona fuji lia manyinga","Mungu njila mo ngutome;","Nguna sakwila kuli Mwene!","Manyinga Jenyi matomesa."]},{"t":"v","n":2,"l":["Kwalumuka achi chinene","Chaheta um mbunge;","Mwono ukulu wasala,","Ku-uchi kupinda."]},{"t":"v","n":3,"l":["Ngwende mu pangu lia mwilu,","Haku konekena;","Mazalo Kristu makwaha","Nyi kukusongwela."]},{"t":"v","n":4,"l":["Yalweza zango liahiana","Yamwanga manyinga;","Ku mungu kamuhalisa","Ha kungu lamwina."]}]},{"n":107,"ti":"Hehi nyi yena Zambi yami","b":[{"t":"v","n":1,"l":["Nguku ndame hehi,","Zambi yami","Chipwe kumisongo","Kungu neza;","Hanga ngukalembe;","Ngwize haka mwihi,","Ngwize haka mwihi,","Zambi yami."]},{"t":"v","n":2,"l":["Nguna nyenganyana,","Mwe mupuya,","Sambukila nyi kuhwima,","Muka ngwaha.","Hanga nguka lembe;","Ngwize haka mwihi,","Ngwize haka mwihi zambi yami"]},{"t":"v","n":3,"l":["Miaso mungu kemba,","Kuli Yena,","Kunguna sakuila","Ha zango Lie.","Hanga nguka lembe;","Ngwize haka mwihi,","Ngwize haka mwihi zambi yami"]}]},{"n":108,"ti":"Yesu kanasanyika","b":[{"t":"v","n":1,"l":["Chifuchi chino cha woma","Kristu kanatusanyika,","Kanechi tangwa nyi tangwa","Akwashili Tweyenu!"]},{"t":"v","n":2,"l":["Kristu kana kukanjisa","Kuwayila mahamba,","Kanatwichi hanga tumwehe,","Zango lize lipema."]},{"t":"v","n":3,"l":["Ha chiseke, ha chinyengo,","Hamilimo nyi kuhwima,","Hakutala nyi kuwaha,","Tumulweze lie zango."]},{"t":"v","n":4,"l":["Mwene wami, chawana Che,","Hanga ungu sanyike;","Mbunge yami yiku zange","Ngulinge milimo Ye."]}]},{"n":109,"ti":"Nguli wa Kristu","b":[{"t":"v","n":1,"l":["Nguhichike yeswe yipi,","Nguli wa mwe Kristu;","Hanga nwivwe liji Lienyi,","Nguli wa mwe Kristu."]},{"t":"c","l":["Yesu ngu kwimbulule,","Chichi kunyenganyana,","Kweswako nyi muzuwo.","Nguli mwe wa Kristu."]},{"t":"v","n":2,"l":["Hana kumbu mukwa khole,","Nguli mwe wa Kristu,","Mangusweka mwe kanawa,","Nguli mwe wa Kristu"]},{"t":"v","n":3,"l":["Chize hash indo mu-uhenya,","Nguli mwe wa Kristu;","Miaso mungu kemba hanga,","Nguli mwe wa Kristu"]},{"t":"v","n":4,"l":["Mwilu mungu kamumona,","Ngupwe mwe wa Kristu;","Mungu kamuhalisa, mba","Ngu kapwe nyi Wenyi."]}]},{"n":110,"ti":"Akwenu kanamono Yesu mukachi ke?","b":[{"t":"v","n":1,"l":["Tuli hakamwihi nyi mwe Yesu,","Kweswe mutuya ku mwono uno,","Akwa Chifuchi matunyingika","Nyi kulifwa cha Yesu?"]},{"t":"c","l":["Kana ngu mwena mwe Yesu?","Kana kumwena mwe Yesu?","Nyi zango ukwete","Kuli mwe Chilamwina?","Kana kumwena mwe Yesu?"]},{"t":"v","n":2,"l":["Zango tuli nalio ngwe lia mwilu,","Akwa shili kanalaluka?","Twakwatenu hanga twa chize mo,","Hanga alilamwine?"]},{"t":"v","n":3,"l":["Ngwe mukanda makatu tangila,","Ha yitanga yetu twakulinga,","Yesu matambula nyi kwa zanga,","Nyi manuvutwokela?"]}]},{"n":111,"ti":"Semuka kamuchali","b":[{"t":"v","n":1,"l":["Ufuku phichi yeza kuli Yesu","Hanga anyingike jila ya pangu;","Mba Longeshi yamwambulwila","Ngwenyi,","Kusemuka ka-ali"]},{"t":"c","l":["Kusemuka ka-ali! Kusemuka ka-ali!","Liji lia mwenemwene Yesu ngwenyi;","Kusemuka ka-ali!"]},{"t":"v","n":2,"l":["Enu, ana ja hashi, yivwenu kuli","Mwene","Kananu sanyika nyi zango liahiana;","Kujishi kumuhwa nyi kwamba ngwenyi;","Kusemuka ka-ali!"]},{"t":"v","n":3,"l":["Nwazanga kuhwimina kuli Zambi","Hanga nukanjile no hamuwika,","Panjikenu kuma liji a Kristu,","Kusemuka ka-ali!"]}]},{"n":112,"ti":"Shimbu ya usandu uliselo yo","b":[{"t":"v","n":1,"l":["Ulisela shimbu ya kushimwinya,","Pwako nyi Longeshi, hanga utange,","Henda nyi athu Jenyi nyi kwakwasa,","Uwahiso wa mwilu Zambi makwaha."]},{"t":"v","n":2,"l":["Shimbu yakutoma ulisela yo,","Haze uli wika lemba nyi Kristu,","Hulikila meso kuli mwe Zambi,","Maka kusongwela ku thachi Jenyi."]},{"t":"v","n":3,"l":["Hapwila ye shimbu yakujikiza,","Kweswe Longeshi maku tetekela;","Chipwe nyi lamba umwononokena,","Zambi hanga kechi kakuvulama."]},{"t":"v","n":4,"l":["Ufunga ye shimbu yino yipema,","Kusula yeswayo jamina Zambi;","Pwako mukwa keke nyi-akwenu","Eswe.","Ukaule mungano ja Chilamwina."]}]},{"n":113,"ti":"Hiyami ko, alioze Kristu","b":[{"t":"v","n":1,"l":["Kanda nulemesa yami, ndo Kristu,","Ami kha, mungu nulweza Kristu;","Ami kha, nyi Yesu nguna yilingi,","Ami kha, ndo Kristu nyi manyonga."]},{"t":"v","n":2,"l":["Ami kha, ndo Kristu mangukolesa,","Ami kha, Kristu ngulembejeke,","Ami kha, Yesu nguchize yiteli,","Ami kha, Kristu, nguchize woma."]},{"t":"v","n":3,"l":["Yesu keshi kuhanjika nyi lwelia,","Yesu, chichi kulinyenga nawa;","Yesu, chichi kulengumuka nawa;","Yesu kalingile ko upi kha."]},{"t":"v","n":4,"l":["Ami kha, Kristu, hana ngufwetela,","Ami kha, Yesu mangwaha thachi;","Yesu, nyi chimwe ndo ye Spiritu ye,","Yesu, nyi chimwe uli wa miaka."]}]},{"n":114,"ti":"Kristu mu mbunge yami","b":[{"t":"v","n":1,"l":["Mbunge yami hapwila yinalumuka,","Se Kristu heza mu mbunge;","Hinawana pangu lize nafupile;","Se Kristu heza mu mbunge!"]},{"t":"c","l":["Se Kristu heza mumbunge, yami,","Se Kristu heza mumbunge, yami,","Cho kuwa chinji ngunevu mu","Mbunge","Se Kristu heza mumbunge;"]},{"t":"v","n":2,"l":["Chichi kwendangana nguhichike jila,","Se Kristu heza mu mbunge;","Shili yami yeswe yangu konekena,","Se Kristu heza mu mbunge."]},{"t":"v","n":3,"l":["Kutalatala chami cha miaka yeswe,","Se Kristu heza mumbunge;","Kuze nawa chichi kanyenganyana","Se Kristu heza mu mbunge."]},{"t":"v","n":4,"l":["Ndo kusongo lia kufwa nguna","Mono pangu,","Se Kristu mumbunge yami","Tale hombo lilemu mulihenyama,","Se Kristu heza mumbunge."]},{"t":"v","n":5,"l":["Limbo liacho mungukapwa shimbu","Yeswe,","Se Kristu mumbunge yami","Mungu kawahilila hakunjila mo,","Se Kristu heza mu mbunge."]}]},{"n":115,"ti":"Nyi kulusu Munguya mwilu","b":[{"t":"v","n":1,"l":["Yesu hanazulula jila mwilu;","Ku kushi nawa yikwo;","Chichi te kanjila um malilu","Nyi chakawile kulusu"]},{"t":"c","l":["Mungu kaya nyi Yesu,","Mwilu ngukaye nyi Yesu,","Kuwaha chami chiseke chinji;","Mwilu Munguya nyi Yesu."]},{"t":"v","n":2,"l":["kumunguya mujila yakulusu","Kwenda nyi kujikiza;","Lie zango liami ngukalie ya mwilu","Che chihinga chamwe Kristu."]},{"t":"v","n":3,"l":["Hinguna hichika majila api;","Kwakaula nawa kha;","Ngukaule Yesu nyi kulusu","Mujila yakuya mwilu."]}]},{"n":116,"ti":"Nguli mwana wa Mwanangana","b":[{"t":"v","n":1,"l":["Nguli wa Mwene mwana wa","Mwanangana,","Mungu kapwa muzuwo Lienyi;","Hingunevu lufuma muji wa mwilu,","Mu katwama nyi Anenyi."]},{"t":"c","l":["Nguli wa mwane mwana wa","Mwanangana,","Aye kechi kangu vulama;","Yiye mangulamwina nyi chawana","Chenyi;","Mungu kapwa mu uhenya Wenyi."]},{"t":"v","n":2,"l":["Nguli wa mwe Soma, zango linji","Akwete,","Sambukila Yenyi uhwimino,","Ha uthu wenyi se hanangu","Hindwisa,","Shimbu yeswe mafunga Anenyi."]},{"t":"v","n":3,"l":["Nguli wa mwe Soma, kanatulakenya;","Malamwina waze amu zanga;","Mu Limbo lia Zambi muchitwamo","Chenyi,","Hamwe nyi akwa ulamwino."]}]},{"n":117,"ti":"Kwenda nyi kutwama nyi Yesu","b":[{"t":"v","n":1,"l":["Chinyengo nenda nacho chiseke kha,","Musono nguli nyi chiseke chinji,","Ngu hanjike nyi Mwene Zambi,","Chamwenemwene nguli wa Yesu."]},{"t":"c","l":["Nguli wa Yesu, aleluya!","Nguli wa Kristu, Mwene!","Chazangile kuphianguka nawa,","Ngwende ngutwame nyi Yesu!"]},{"t":"v","n":2,"l":["Napwile nyi kulinga shili yinji,","Chifuchi changu mbilile mu mbongo;","Hapwila nguli kajila wa mwilu,","Hina pema mumu nguli wa Yesu!"]},{"t":"v","n":3,"l":["Mwono waluyinda, kanda ulila?","Kuli Kristu hiwawana ulamwino;","Chiseke cha miaka nyi ulamwino;","Tweya, tweya kuli Kristu, kawashi!"]}]},{"n":118,"ti":"Ami hano nguli ngeji","b":[{"t":"v","n":1,"l":["Nejile ngwe ngeji nyi kutwama","Hano,","Ku usoma wa mwilu nguli mwe","Kanganda!","Soma yami Yesu, wanutuma Liji","Liji lia ukonekeno."]},{"t":"c","l":["Sango aji angutumine","Yesu watufwilile;","Wanenu nyi Yiye, che chiyulo Chenyi,","Wanenu nawa nyi Zambi!"]},{"t":"v","n":2,"l":["Shimbi ya mwe Soma mukwa shili","Mweswe","Alikonyike kuli Chilamwina","Mweswe mukwa shili kana lilakenya","Kukonekena nyi zango."]},{"t":"v","n":3,"l":["Zuwo liami mwilu kulishi nyi woma;","Waze malamwina maka wahilila!","Makamona Zambi maka twama Nenyi","Mu wanangana wa mwilu."]}]},{"n":119,"ti":"Yesu nguna zange","b":[{"t":"v","n":1,"l":["Nguna zange Yesu!","Mwe Yena a Mwene!","Nyi liji lia Yena","Mungu huzuluka!"]},{"t":"c","l":["Mwe Chilamwina chami;","Nguna kuzange chinji!","Hanga ungu wahise;","Nguna hono!"]},{"t":"v","n":2,"l":["Nguna zange Yesu!","Ngulinunge Nyenyi!","Shili nyi yizezo","Kuyishi nyi thachi!"]},{"t":"v","n":3,"l":["Mu shimbi ya yena","Tweya ungu longese","Nguna zange kwivwa","Zango Lie liahana."]},{"t":"v","n":4,"l":["Chilamwina chami","Yena ha yizezo","Ungu konekene","Ngwehe ulamwino."]}]},{"n":120,"ti":"Ami nguna kuzange chinji!","b":[{"t":"v","n":1,"l":["A mwene nguna kuzange!","Nguli mwe mukwa shili,","Kwata kama kwoko liami,","Ngusongwele nyi zango Lie."]},{"t":"c","l":["Haliapwa, chize haliapwila,","Mwene ami nguna kwichi;","Haliapwa, chize haliapwila,","Ungufunge a Mwene."]},{"t":"v","n":2,"l":["Ungujike uzalo We","Uzalo wami wapwi;","Nguli mupi nguna lele","Hanga ungwehe thachi."]},{"t":"v","n":3,"l":["Nguna jikijila Zambi;","Nyi kha mungu limbuka;","Mwene ngusongwele kama,","Nguwendele mu pangu Lie."]},{"t":"v","n":4,"l":["Nyi kulutwe mungu wana,","Luyinda nyi chiseke;","Ngujamine kuli Yena,","Hanga ungu songwele."]}]},{"n":121,"ti":"Kulembejeka","b":[{"t":"v","n":1,"l":["Lihumikize a mbunge yami,","Nyi kuhwimina kuli Zambi.","Ha zango lienyi makangusweka,","Nyi kuhwimina kuli Zambi"]},{"t":"c","l":["Uhwimino,","Mwe mukhondo ya Zambi yami;","Ngujikize,","Nyi kuhwimina kuli Zambi."]},{"t":"v","n":2,"l":["Nguye kulutwe chiseke chinji","Mungu hwimina kuli Zambi","Ku thachi Jenyi mungu kakumba,","Nyi kuhwimina kuli Zambi."]},{"t":"v","n":3,"l":["Nyi chimwe te munguvwila woma,","Nyi kuhwimina kuli Zambi.","Yiwape yeswe yukuli Mwene,","Nyi kuhwimina kuli Zambi."]},{"t":"v","n":4,"l":["Nyi jita muyingujingilika,","Mungu hwimina kuli Zambi.","Kechi kangwecha mangu pulula,","Nyi kuhwimina kuli Zambi."]}]},{"n":122,"ti":"Chawana chipema cha mwilu","b":[{"t":"v","n":1,"l":["Ngunevu miaso ya mwilu…mwilu,","Ye miaso ya kuwaha nyi…kwimba;","Mayimba nyi chiseke chinji","Vumbi! Chawana Chenyi."]},{"t":"c","l":["Sambukila","Achi chawana cha mwilu!","Kuwaha chiseke Chinji,","Keke chawana cha Zambi!"]},{"t":"v","n":2,"l":["Kristu yafwa hakulusu…Yafwa,","Mba yatu fwetela kongo…lietu,","Kashika twa tambwile lume","Sambukila ya Zambi."]},{"t":"v","n":3,"l":["Mwanangana wami Yesu…Yiye","Se nguna wane keke Ye…yinji","Nguna wane chiseke chinji","Sambukila chawana cha Zambi!"]},{"t":"v","n":4,"l":["Kupwa hamwe nyi mwe Yesu…Yesu,","Chiseke cha Yiye chinji…chinji,","Mawahisa matanwa eswe","Chawana cha Zambi yami."]}]},{"n":123,"ti":"Mbunge ye musanbukila","b":[{"t":"v","n":1,"l":["Milima yinalayisa majila je,","Kanda wivwa chinhengo halisa","Zambi!","Lelwa lia liakuneha lukhongolo,","Muze sambukila muyisa mu mbunge."]},{"t":"c","l":["Mbunge yipwe nyi sambukila,","Muka wana ye sambukila yahiana;","Mbunge yipwe nyi ye sambukila,","Kumukamona lelwa lia lukongolo."]},{"t":"v","n":2,"l":["Nyi mu mwono kulithachika nyi","Lamba,","Lamba lie leswe kumu kalivulama;","Kumu kapwa nyi sambukila nyi zango."]},{"t":"v","n":3,"l":["Ufuku mu-uhwa kwilu hanga kuche;","Lilu hilia temuka lamba hilihwa!","Kutuchi katoka ndo mutukakumba!","Yinyengo muyihwa kwize","Sambukila."]}]},{"n":124,"ti":"Ngutwame ku molu a Kristu","b":[{"t":"v","n":1,"l":["Ngutwame ku molu –a Kristu","Ngwivwe chize mangwamba!","Ngupanjike liji Lienyi","Sambukila mu mbunge;","Nyi mungu tala kunyima,","Muze nguli nyi Yesu,","Shimbu yeswe ngulemese","Chawana cha kulusu."]},{"t":"v","n":2,"l":["Ngutwame ku molu –a Kristu,","Ngutambule uwahiso,","Shili yami nguyitwale,","Kuma ngukonekena;","Ngutwame ku molu –a Kristu,","Kuze mungu kalemba,","Thachi jami kumujiza,","Kuma ngwaha chawana!"]},{"t":"v","n":3,"l":["A Yesu ungu wahise,","Kutala che cha Zango!","Hanga chingupwile chashi","Kukamona Huma Lie;","Ngwhe manyonga apema","Hanga ngupwe ngwe Yena!","Nguchilweze kuli akwetu,","Nguli Mwane wa pangu."]}]},{"n":125,"ti":"Kululama","b":[{"t":"v","n":1,"l":["Cheseko cha mwenemwene,","Muka mona lamba,","Mukapwa nyi sambukila","Nyi kuli hana."]},{"t":"c","l":["Lihane ko,","Mujila yipema,","Saka chawana chahiana,","Nyi kuli hana."]},{"t":"v","n":2,"l":["Muze yizezo muyiza,","Yako ukalembe;","Mukakumba hakusula,","Nyi kuli hana."]},{"t":"v","n":3,"l":["Yeswe, yeswe yinahenge,","Yeswe kuchikima;","Thachi jinji mwopwa najo,","Hakuli hana."]},{"t":"v","n":4,"l":["Nyi umwe makwamba yipi,","Mukonekene yo;","Lemba Yesu kumakwivwa,","Nyi kuli hana."]}]},{"n":126,"ti":"Chiyulo chinahiana","b":[{"t":"v","n":1,"l":["Achino Chifuchi chipi,","Nyi ye jila yacho yipi,","Mungu kwita Chilamwina:","Utumbate, Chilamwina!"]},{"t":"c","l":["Hanga Yesu ungu mbate,","Ku uhenya nyi lie zango,","Mangu funga munguheta","Ku limbo lize lia mwilu!"]},{"t":"v","n":2,"l":["Kuheshi zango he hano,","Chiseke se kuchishiho;","Miaka yeswe lamba wika","Nguna zange kuli Yena."]},{"t":"v","n":3,"l":["Nguna zange nguka twame,","Mumu hajina lia Yena!","Hina wana ufulielo","Chifuchi cha ulamwino."]}]},{"n":127,"ti":"Kutwama hatho ya meya","b":[{"t":"v","n":1,"l":["Tu twame kumeya a mwono,","Eno mavwelwoka,","Nyi pwila mungu nwisa mwono","Kwenako mungunwa."]},{"t":"c","l":["Ngutwame tulwiji a mwono,","Tuluiji alemu a mwono","Nyi pwila ngunwise mwono,","Ngunwe pwila yinguhwe."]},{"t":"v","n":2,"l":["Kujina tuhu nyi milimo,","Muhapwa kuhwima;","Hano ha meya waze a mwono","Mbunge yihuzuluke."]},{"t":"v","n":3,"l":["tweya uchivwe meya ja mwono","Kristu maka kwaha;","E meya a mwono wa miaka","Mba pwila muyihwa."]},{"t":"v","n":4,"l":["Yoze manwa meya a mwono","Masemuka chaha;","Mwe mwilu, muli lwiji wa mwono","Muwiza kunwa mo."]}]},{"n":128,"ti":"Fulielenu nyi kwononoka","b":[{"t":"v","n":1,"l":["Fulielenu Yesu nyi kufunga shimbi","Kuwaha sambukila yinji!","Nyi chiseke nyi ku funga yeswe","Mamba,","Miaka yeswe twivwe chiseke."]},{"t":"c","l":["Fulielenu yeswe manutuma;","Washishika mononoka yize Kristu","Mamba!"]},{"t":"v","n":2,"l":["Mukwa khole mamba, mukwa saki","Awezele","Kristu Yiye mahangulula;","Chinyengo nyi yikola, chipwe saki","Jinji","Wafuliela kechi kwivwa woma"]},{"t":"v","n":3,"l":["Zango linapeme, kuli kata nyi","Mwene","Chinatela mukwa kufuliela;","Huma Lienyi liato, zuka jila Jenyi,","Yiye makakulembejeka."]},{"t":"v","n":4,"l":["Mwene twatongola, zango nyi","Ufulielo,","Mutu kukaula mungano Je","Tufunge shimbi Je, Jina Lie","Lifumane.","Tuhetese chize wazanga"]}]},{"n":129,"ti":"Yesu mangusongwela","b":[{"t":"v","n":1,"l":["Kuwaha Yesu, mangu twala!","Liji lia kulembejeka!","Chipwe ku lamba lieswalio,","Kwoko Lienyi lingutwale."]},{"t":"c","l":["Chiseke Yesu mangutwala,","Kwoko Lienyi lingu twale,","Mungano jeswe angutwale","Ngusonwele Mwene Yesu."]},{"t":"v","n":2,"l":["Chipwe mungu mona lamba,","Mukachi ka mwongo nyi yikola,","Ku meya apema hanji kalunga","Mwene wami ngusongwele."]},{"t":"v","n":3,"l":["Ngu kwase kanda ngulinyenga,","Ha cheswacho muchingwiza;","Nyi kuwaha mungu twala;","Kwoko Lie lize lia uthu."]}]},{"n":130,"ti":"Yesu nyi wami kakungosongwela","b":[{"t":"v","n":1,"l":["Yesu kakungu songwela,","Te mungu zanga chimwe?","Naku khakhajana Kristu?","Nyi kufuliela Zambi?","Sambukila nguli nayo,","Ya uwahililo We;","Ku makangu funga chinji","Nyi mbunge Ye ya uthu","Ku makangu funga chinji","Nyi mbunge Ye ya uthu."]},{"t":"v","n":2,"l":["Yesu kakungu songwela,","Ngulongese kutwama,","Ngwehe chawana nyi thachi,","Hanga mba ngujikize.","Chichi katoka nawa kha,","Yiya mba mamana ko","Kuli Zambi mwe Chisemi,","Wazanga kufu kula?","Mwe Zambi Tata wathachi","Wazanga kungu kula?"]},{"t":"v","n":3,"l":["Yesu kakungu songwela,","Nyi zango Lienyi liahiana!","Mwono upema wa miaka","Mwene ngu kwase kama.","Tangwa Lie hilia kundama,","Lia ulamwino wetu,","Muze mukatu lamwina,","Tuka likungulule","Muze mukatu lamwina,","Tuka likungulule."]}]},{"n":131,"ti":"Ngunazange Chilamwina","b":[{"t":"v","n":1,"l":["Nguna zange Chilamwina,","Kwenda ukawami kha","Ngunazange apwe hehi,","Nguhwimine kuli Yiye."]},{"t":"c","l":["Nguku…fuliele Mwene,","Ngulembe…jeke kama,","Jila ye …swayo Munguya,","Woma nyi chinyengo kha."]},{"t":"v","n":2,"l":["Nguna zange Chilamwina,","Ufulielo nahona.","Liji Lie lingukolese,","Muze mungu phaianguka."]},{"t":"v","n":3,"l":["Nguna zange Chilamwina,","Mu-ungeji wa mwono.","Ku chinyengo, nyi milimo,","Ha lamba nyi chiseke."]}]},{"n":132,"ti":"Ngunazange kwenda nyi yena Mwene","b":[{"t":"v","n":1,"l":["Zambi ngwende hamwe nyi Yena,","Chize wendele nyi Yinoke.","Ngu kwate kama nyi kwoko Lie,","Mumu ami ngunalele.","Chipwe mujila munala pwi","Hindu nguye hamwe nyi Mwene."]},{"t":"v","n":2,"l":["Cha hashile kwenda a Zambi;","Mukwa khole kanakenana,","Se hana ngutela miheto;","Hana ngujikinyina kweswe","Akangutwale ngukatoke;","Kuli Yena kuli ulamwino."]},{"t":"v","n":3,"l":["Ngwendele hamwe nyi Yesu","Chiseke cha hashi nyi chimwe;","Ami ngulitwike kulusu","Munguya, nyi woma wakuhi.","Ngukahete kuzuwo mwilu","Ngukendele hamwe nyi Yesu."]}]},{"n":133,"ti":"Muze mukapakula mukanda","b":[{"t":"v","n":1,"l":["Muze ngaji mapakula mukanda","Chiseke mukevwa?","Jina lie mulikapwa kuli Mwene","Nyi kuli waze makatoka?"]},{"t":"c","l":["Nyi chiseke …mungukemba mwaso","Mwaso wakuhalisa;","Mumu jina liami halisoneka","Mu Mukanda wa chilamwina."]},{"t":"v","n":2,"l":["Muze chitavwi muchishika","Ngaji makatuka mwilu,","Mungu kapwa nyi masepa Jenyi,","Nyi hanji waze amunwa?"]},{"t":"v","n":3,"l":["Muze makasolola yitanga ye","Mukevwa Yesu makamba;","Au Tata hingu namulamwina","Mukwa shili apwe nyi mwono"]}]},{"n":134,"ti":"Kweswe nyi Yesu","b":[{"t":"v","n":1,"l":["Kweswe Hamwe nyi Yesu","Kumunguya,","Mwanagana wami nyi Chilamwina","Chipwe kujita hindu kumunguya,","Chipwe kuminda tuye nyi kulima."]},{"t":"c","l":["Kweswako, kweswako, Zambi","Manwamba,","Hehi nyi chilamwina mungwendela."]},{"t":"v","n":2,"l":["Kweswe nyi Chilamwina mungu","Kapwa,","Mbunge yam