ami."]},{"t":"c","l":["Kristu, Kristu,","Ungwivwe kama!","Walamwinyine akwetu,","Kanda ungu hiana."]},{"t":"v","n":2,"l":["nguna liumbu kuli Yena,","Chinyengo, chinji,","Ungu lembejeke kama;","Mu mbunge yami."]},{"t":"v","n":3,"l":["Mumu lia manyinga ja Yena,","Ku chawana che,","Mbunge yami ya chinyengo,","Ngwehe zango Lie."]},{"t":"v","n":4,"l":["Yena shima lia uhwimino,","Ukwete mwono;","Ngu huzule hapwila,","Ngu konekene."]}]},{"n":45,"ti":"Liji lipema lia Chilamwina","b":[{"t":"v","n":1,"l":["Liji lipema lia Yesu","Katwaha lio chawana;","Matu sanyika nyi zango,","Hanga atwehe mwono."]},{"t":"c","l":["Keshi kwivwa ko e athu,","Chipwe mwilu muli, pangu","Maliji jacho apema","Lie jina Lienyi Yesu."]},{"t":"v","n":2,"l":["Musenge wacho usasu,","Yesu wanwine weswe,","Kuli yoze mukwa shili,","Hanga amu konekene."]},{"t":"v","n":3,"l":["He ha ulamwino unene,","Kau hana chawana,","Chatamba ku chi-uluka","Hapwila nyi ku miaka."]}]},{"n":46,"ti":"Sambukila yingunu","b":[{"t":"v","n":1,"l":["Mwene Yesu naku zanga,","Kuhiana Chifuchi;","Sambukila wangu hele","Ngu chine kutoka."]},{"t":"c","l":["Kuli amwe kevwile ko,","Ku zango lia yena!","Kuli akwo kevwile ko,","Ku sambukila Ye."]},{"t":"v","n":2,"l":["Mwene haka mwihi uli","Kuhiana masepa;","Naku wahilila chingi,","Muze mungu nyonga."]},{"t":"v","n":3,"l":["Chiseke chinji ngunevu,","Kuchina supwoka;","Nyi kachi chishi nyi Yena,","Mungu vulumuna."]},{"t":"v","n":4,"l":["Yena Chilamwina chami,","Nguna wahilila","Hamwe nyi Yena woma kha,","Nguka mone huma Lei."]}]},{"n":47,"ti":"Tweya kuli yami uhwime","b":[{"t":"v","n":1,"l":["Liji lia Yesu nevwile,","Tweya kuli Yami;","Kujina kuhu uhwime","Nguku lembejeke;","Mba kuli Yesu nejile","Ngwe mukwa chinyengo;","Yingu wana uhwimino,","Nyi kulembejeka."]},{"t":"v","n":2,"l":["Liji lia Yesu nevwile,","Ngwo a mukwa pwuila;","Wakama meya a mwono,","Hetama hanga unwe;","Mba kuli Yesu nejile","Nanwine e meya;","Nguna yuku pwila yahwa,","Mba hanga ngutwame."]},{"t":"v","n":3,"l":["Liji lia Yesu nevwile,","Nguli pangu hashi,;","Linga wize kuli yami utambule pangu,","Nawanyine Mwene Yesu,","Tangwa lia henyama","Mu lie pangu mungwendela,","Ndo songo lia miaka"]}]},{"n":48,"ti":"Hanjikila mu mbunge yami","b":[{"t":"v","n":1,"l":["Ngu hanjikile –A Kristu, nyi zango mu mbunge;","Uli nyingune Mushi: Nguli Chilamwuina.","Ngwazule mu mbunge, mba ngwivwe liji Lie,","Hanga ngu kuhalise, Ngupwe nyi We pundu."]},{"t":"c","l":["Linyingune nyi yami, ungwiulule ngwe;","Namwangine manyinga muku kulamwina.","Heswe nguli hanjika, nyi zango Lie lieswe,","Nguwambulwile mu twitwi: Nguli Chilamwina."]},{"t":"v","n":2,"l":["Hanjika nyi ana Je, hanga wa songwele;","Azale nyi chiseke, ku milimo yeswe;","Apwise kama –a ngunu, a kakulingile","Uli mwe Mwanangana, hapwila muwiza."]},{"t":"v","n":3,"l":["Nguwe chize walingile, yikomokeso Ye;","Nyi yami ungu lweze, se nguna yizange;","Kunguna zange wika, ngu halise Yena,","Miaka yeswe jina Lie, munguli vumbika."]}]},{"n":49,"ti":"Twivwe kama kafunga wa mwilu","b":[{"t":"v","n":1,"l":["Twivwe akafunga wa mwilu,","Ku chihela chipema,","Twali kungulwila mutanga,","Hanga tuku lemese.","Tu zangenu Yesu Mwene,","Tweya utu wahise,","Yesu mwene watu zanga,","Tweya utu wahise."]},{"t":"v","n":2,"l":["nyi mutoka mwe mushili","Nyi woma-wo mamona;","Tuka sanyike e yiswale,","Hanga evwe maliji;","Tunayiji, tunayiji,","Meza nyi kwalamwina?","Tunayiji, tunayiji,","Meza atu lamwine."]},{"t":"v","n":3,"l":["Neha chiswale ana kase","Mutanga Lie a Mwene;","Tambulako phanga mulelu","Mu khondo –Ye kafunga;","Twehe kulia, twehe kulia,","Cha zango Lie lia Mwilu.","Twehe kulia, twehe kulia,","Cha zango Lie lia Mwilu."]},{"t":"v","n":4,"l":["Evwa kama kulemba chetu","Che cha uhomboloji,","Zalisa kama lie tanga Lie","Nyi unene wa Yena;","Hanga tuku chichimieke,","Wakufunga kanawa.","Hanga tuku chichimieke,","Wakufunga kanawa."]}]},{"n":50,"ti":"Jina lipema","b":[{"t":"v","n":1,"l":["Mbatako jina lilemu,","Lia yesu Chilamwina;","Muli kaku lembejeka","Kweswa