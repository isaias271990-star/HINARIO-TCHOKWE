name: Gerar Aplicativo e APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar ZIP Offline Completo
        run: zip -r Hinario-Tchokwe-Offline.zip . -x ".git/*" ".github/*"

      - uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-ZIP
          path: Hinario-Tchokwe-Offline.zip
