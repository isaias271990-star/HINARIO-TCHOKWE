name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Renomear Assets e Compilar
        run: |
          # 1. Renomear aplicativo para app se necessario
          if [ -d "aplicativo" ] && [ ! -d "app" ]; then
            mv aplicativo app
          fi

          # 2. Renomear Ativos para assets se necessario
          if [ -d "app/src/main/Ativos" ] && [ ! -d "app/src/main/assets" ]; then
            mv app/src/main/Ativos app/src/main/assets
          fi

          # 3. Garantir hinos.json na pasta data
          mkdir -p app/src/main/assets/data
          HINOS_PATH=$(find app/src/main/assets -iname "*hinos*.json" | head -n 1)
          if [ -n "$HINOS_PATH" ] && [ "$HINOS_PATH" != "app/src/main/assets/data/hinos.json" ]; then
            cp "$HINOS_PATH" app/src/main/assets/data/hinos.json
          fi

          # 4. Compilar APK com Gradle 8.7
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-IASD
          path: '**/build/outputs/apk/debug/*.apk'
