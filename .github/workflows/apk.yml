                  <!-- Chamas da Esquerda (Laranja Oficial) -->
                  <path d="M250 110 C230 160 170 230 165 300 C165 330 175 350 195 365 C180 340 178 315 185 285 C192 255 220 205 250 155 C262 135 258 118 250 110 Z" fill="#d95804"/>
                  <path d="M235 160 C205 200 185 245 185 290 C185 315 195 335 212 350 C198 330 198 305 205 280 C212 250 230 215 255 180 Z" fill="#d95804"/>
                  <path d="M220 220 C200 255 195 285 200 320 C208 335 218 345 230 355 C218 340 215 320 220 300 C225 275 240 245 260 215 Z" fill="#d95804"/>
                  
                  <!-- Chamas da Direita (Laranja Oficial) -->
                  <path d="M255 210 C270 245 295 275 312 300 C330 325 335 350 328 375 C335 350 330 320 3
