name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Empacotar e Injetar Assets
        run: |
          # 1. Renomear pastas se necessario
          [ -d "aplicativo" ] && mv aplicativo app || true
          [ -d "app/src/main/Ativos" ] && mv app/src/main/Ativos app/src/main/assets_temp || true
          [ -d "app/src/main/Assets" ] && mv app/src/main/Assets app/src/main/assets_temp || true

          # 2. Criar a pasta oficial assets
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/assets/data
          mkdir -p app/src/main/assets/dados

          # 3. Encontrar index.html e copiar todos os arquivos web para assets
          INDEX_FILE=$(find . -name "index.html" | head -n 1)
          if [ -n "$INDEX_FILE" ]; then
            SRC_DIR=$(dirname "$INDEX_FILE")
            echo "Copiando de $SRC_DIR para app/src/main/assets/"
            cp -rf "$SRC_DIR"/* app/src/main/assets/ || true
          fi

          # 4. Encontrar hinos.json e garantir nas pastas data e dados
          HINOS_FILE=$(find . -iname "*hinos*.json" | head -n 1)
          if [ -n "$HINOS_FILE" ]; then
            echo "Hinos encontrado: $HINOS_FILE"
            cp -f "$HINOS_FILE" app/src/main/assets/data/hinos.json
            cp -f "$HINOS_FILE" app/src/main/assets/dados/hinos.json
            cp -f "$HINOS_FILE" app/src/main/assets/hinos.json
          fi

          # 5. Injetar Autoria Oficial no aplicativo (Sem icones, formato formal)
          CREDITOS='<footer style="text-align:center;padding:25px 15px;margin-top:35px;font-size:0.9em;opacity:0.9;border-top:1px solid rgba(128,128,128,0.3);line-height:1.6;"><p style="margin:4px 0;font-weight:bold;font-size:1.15em;color:#2e7d32;">Hinário Tchokwe - IASD</p><p style="margin:6px 0;"><strong>Desenvolvedor:</strong> Isaías Muwaneno João (Líder)</p><p style="margin:4px 0;"><strong>Revisão e Correção do Hinário:</strong> Pastor Nunes Sacavumbi Lucas (Líder)</p><p style="margin:4px 0;"><strong>Colaboradores:</strong> Januário Justo Miranda &amp; Ecal Gomes</p><p style="margin:10px 0 0 0;font-size:0.8em;opacity:0.75;">Para a Glória de Deus • Edição 2026</p></footer>'
          sed -i "s|</body>|$CREDITOS</body>|g" app/src/main/assets/index.html || true

          # 6. Ativar permissoes no MainActivity para o Samsung S21 (Android 14)
          MAIN_JAVA=$(find app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_JAVA" ]; then
            if ! grep -q "setAllowFileAccess" "$MAIN_JAVA"; then
              sed -i '/setJavaScriptEnabled/a \        webSettings.setAllowFileAccess(true);\n        webSettings.setAllowContentAccess(true);\n        webSettings.setAllowFileAccessFromFileURLs(true);\n        webSettings.setAllowUniversalAccessFromFileURLs(true);' "$MAIN_JAVA" || true
            fi
          fi

          # 7. Compilar APK com Gradle 8.7
          gradle assembleDebug --stacktrace

          # 8. Injetar os hinos e creditos diretamente no APK
          echo "Injetando assets com creditos no arquivo APK..."
          (cd app/src/main && zip -r -u ../../../app/build/outputs/apk/debug/app-debug.apk assets)

          # 9. Assinar o APK com apksigner para o Android 14
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Assinando APK com: $APKSIGNER"
          $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android app/build/outputs/apk/debug/app-debug.apk

          # 10. Confirmar tamanho final
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-IASD
          path: '**/build/outputs/apk/debug/*.apk'
