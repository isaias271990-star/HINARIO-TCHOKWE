name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hinario-app
    steps:
      - uses: actions/checkout@v4

      - name: Verificar ficheiros do projeto
        run: |
          test -f settings.gradle || { echo "ERRO: falta hinario-app/settings.gradle"; exit 1; }
          test -f app/src/main/assets/index.html || { echo "ERRO: falta a interface em assets"; exit 1; }
          test -f app/src/main/assets/hinos.js || { echo "ERRO: faltam os hinos em assets"; exit 1; }
          echo "Projeto completo."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Dar nome ao APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/hinario-tchokwe.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: hinario-tchokwe-apk
          path: hinario-app/app/build/outputs/apk/debug/hinario-tchokwe.apk
          if-no-files-found: error

      - name: Publicar ligacao de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Hinario Tchokwe (APK para Android)
          body: Descarregue o ficheiro hinario-tchokwe.apk, abra-o no telemovel e instale.
          files: hinario-app/app/build/outputs/apk/debug/hinario-tchokwe.apk
          make_latest: true
