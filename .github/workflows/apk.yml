Tu kapuluke ku lamba."]},{"t":"v","n":2,"l":["Ku pomba muli mwe Kristu,","Ku hinduka nyi chiseke;","Mba Aye akatu mbate;","Nyi chiseke chinji mwilu."]},{"t":"v","n":3,"l":["Ku pomba muli mwe Kristu;","Tu chine ku upi weswe;","Ku hichika ye yizezo,","Mba ukapwe nyi we mwono."]},{"t":"v","n":4,"l":["Mukwetu pomba nyi Kristu;","Mukapwa nyi sambukila;","Uchi kapwa nyi yizezo,","Haku kanjila mo mwilu."]}]},{"n":195,"ti":"Kuli Yesu te chimwe?","b":[{"t":"v","n":1,"l":["Mwene Yesu kuna nyingika","Se hashi nguna pinji","Mbunge yami yato nyi lamba?","Kulinyenga chami wivwa?"]},{"t":"c","l":["Yesu kaku mona yeswe","Muze nguli nyi lamba.","Ku upi utenu nyi ungalwe,","Se Yesu mangu kwasa."]},{"t":"v","n":2,"l":["Mwene Yesu kuna nyingika","Nguli wamokomoko.","Kwenda mupangu lia kulusu?","Chilamwina kuma ngwivwa?"]},{"t":"v","n":3,"l":["Mwene Yesu kuna nyingika","Chipwe te manguzeza?","Satana mangwiya ufulielo,","Mukangu konekena?"]},{"t":"v","n":4,"l":["Mwene Yesu kuna nyingika","Kufwa muchi ngwenyeka?","Ngu shike wawa wa akwetu","Yesu kuma kechi kevwa?"]}]},{"n":196,"ti":"Kushi kulishika","b":[{"t":"v","n":1,"l":["Nyi kachi mutu zanga akwetu","Muyiza ye shimbu,","Ha ola ya lamba mamba ngwo","Salenu kanawa."]},{"t":"c","l":["Ku kushi kuli shika,","Ku kushi kuli shika.","Ku Chifuchi chize chaha","Kushi kulishika."]},{"t":"v","n":2,"l":["Kuwaha ha kumona akwetu","Muze maya mwilu,","Muze Yesu makeza hano,","Mba mu tukamona."]},{"t":"v","n":3,"l":["Muze kumushi kuli shika,","Ngwe te hano hashi,","Se sambukila kuli waze","Maka lilamwina."]}]},{"n":197,"ti":"Zambi anufunge","b":[{"t":"v","n":1,"l":["Zambi apwe hamwe nyi yenu,","Endele halumbu lienu,","Anukwase yenu eswe,","Anufunge nyi thachi Jenyi."]},{"t":"c","l":["Unene Wenyi nyi zango Lienyi,","Mutuka takana nyi Yesu;","Nyi thachi Jenyi nyi zango Lienyi,","Zambi apwe hamwe nyi yenu."]},{"t":"v","n":2,"l":["Anufunge nyi zango Lienyi,","Anulembejeke kama,","Kukahete kuli akwenu;","Anufunge nyi zango Lienyi."]},{"t":"v","n":3,"l":["Zambi anufunge ku yipi,","Muze munu mona lamba,","Kuli mika nyi yahashi.","Zambi anufunge ku yipi."]},{"t":"v","n":4,"l":["Anufunge numu halise,","Nyi chiseke Chenyi chaha,","Kumilimo ya ya uhenya,","Anufunge numu halise."]}]},{"n":198,"ti":"Kukumba nyi Yesu","b":[{"t":"v","n":1,"l":["Uhenya hiwasolola","Wa Yesu Mwanangana,","Makevwa shimbi Jenyi;","Yilayi yakwiza Chenyi,","Yeswe hiyasoloka","Yesu hakumba kaneza."]},{"t":"c","l":["Uhenya, uhenya! Aleluya!","Uhenya, uhenya! Aleluya!","Uhenya, uhenya! Aleluya!","Yesu hakumba kaneza."]},{"t":"v","n":2,"l":["Chitavwi cha-akwa ufulielo,","Ku jita hicha shika.","Kristu kulutwe lia athu Jenyi,","Mbunga hayitambula,","Mukwa khole himachina,","Uli wamwoka naye","Yesu hakumba keneza."]},{"t":"v","n":3,"l":["Muze te hamuhingisa,","Mavungu masopesa;","Anene nyi waze akehe","Ngaji himasopesa,","Khule eswe waze hakumba,","Himemba nyi chiseke","Yesu hakumba kaneza."]}]},{"n":199,"ti":"Zambi kakangana","b":[{"t":"v","n":1,"l":["A Zambi Yena wika, watela uhaliso,","Yena ku miaka yeswe, tukakuhalise!","He hashi watangile, watanga e malilu","Milimo wayimana nyi Moko Lie Mwe","Zambi."]},{"t":"v","n":2,"l":["Mwe Soma yama Soma, unene We","wahina","Ulemu We wahiana, ku ushi","Kwalumuka","Angelo mawayila mu Mbala Ye ya","mwilu,","athu Je kana kwichi hanga wavwile","keke."]},{"t":"v","n":3,"l":["Yuma yingahi, yingahi, walinga nyi","unene We,","nyi yikomeso Ye, nguna kuhalisa,","yena Lukhepwe wami, Mwe","mwanangana Soma","kechi kungwonga nawa, ngupwe mu","Usoma We."]}]},{"n":200,"ti":"Yesu, uchinyino wami","b":[{"t":"v","n":1,"l":["Yesu wazanga Chilamwina chami,","Nakumu komoka chinji;","Muchi swamo cha liwe, mangu","sweka, mapha chiseke cha miaka."]},{"t":"c","l":["Muchi swamo cha liwe mangu sweka.","Muphuya mwalwa wahiana;","Wakungu sweka nyi zango lia Yena;","Ngufuke kama kwoko Lie e e …","Ngufuke kama kwoko Lie e e …"]},{"t":"v","n":2,"l":["Muchi wazango Chilamwina chami,","Nguchize yinyengo yinji;","Mangwaha thachi, mangutakamisa,","Mba hanga nguli thachike."]},{"t":"v","n":3,"l":["Nguzalise nyi uwahiso unji.","Nguku halise nyi miaso;","Hakwimba munguku halisa Yesu,","Chilamwina mukwa uthu."]},{"t":"v","n":4,"l":["Hakusula ngu hinduke nyi uhenya,","Yesu mangu sambilila!","Mungu kapwa nyi chiseke cha miaka,","Nyi njimbi waze ahiana."]}]},{"n":201,"ti":"Kalayi, kwasala chingahi?","b":[{"t":"v","n":1,"l":["Kalayi, shimbu yika mba","Tangwa muli thuthuka?","Ufuku hindu unene","Nyi hanji himukucha?","Ngeji hima laula,","Hakuthuthuka tangwa!","Zala mba utale tale,","Tangwa linathuhuka."]},{"t":"v","n":2,"l":["Kalayi tala lie pangu","Liatemwina jila ye,","Yilayi yinatulweze","Shimbu yina palika","Akwa usandu waze afwile,","Mahinduka nyi mwono,","Nyi matwi jo kumakevwa","Chithavi cha ulamwino."]},{"t":"v","n":3,"l":["Kalayi walweza pangu","Mwaka wa sambukila;","Kololoka nyi chiseke,","Chihete ku mihwahwa!","Ngeji, ami ngunamono","Mulimbo pangu liacho;","Matapalo muli ulu","Mwazala muo uhenya."]},{"t":"v","n":4,"l":["Kalayi tala Chifuchi,","Mihuko nyi yitemo","Tala Soma um-uhenya,","Lwiji ngwe katalilo","Evwa tulialia kuwaha!","Animbi maswalale.","Ngeji evwa cho kuwaha","Hapwila muheta mo."]}]},{"n":202,"ti":"Kutwaminyina nyi kutalatala","b":[{"t":"v","n":1,"l":["Twa nyingikine muze meza","Chimene nyi ha ufuku","Hanji meza ku shimbu yimwe;","Haku thuhuka cha tangwa.","Mwene kana twambe tufunge,","Lie pangu lie litemuke;","Yesu muze makatuwana","Kutuna mutalatala."]},{"t":"c","l":["Kutala tala nyi kukanyama,","Nyi kukanyama;","Kutunamu twaminyina."]},{"t":"v","n":2,"l":["Kunguna nyongo keke Yenyi","Handando ya we ukule;","Ya hichika uhenya Wenyi","Mweza yatumwena lamba","Se hana tuvwila chiseke.","Muze maka mona khule","Kutwaminyina shimbu yeswe","Kutuna mutwaminyina."]},{"t":"v","n":3,"l":["Yesu mwe Chilamwina chami","Kanyingika zango liami","Mungu kapwa kulumbu Lienyi!","Mungu kevwa liji Lienyi!","Nyi kuli mwono wa thu amwe","Akuvwila woma Yena,","Amy nguli sepa lia Yena,","Kunguna kutwaminyina."]}]},{"n":203,"ti":"Chize Yesu anguzanga","b":[{"t":"v","n":1,"l":["Mungu nwambulwila Yuma ya","Longeshi!","Chize natambwile pangu lia mwono;","Kristu Yiye wangwalumwine lume;","Kukushi mukwo walifwa ngwe Yiye"]},{"t":"c","l":["Mungufunga Longeshi yami,","Zango keke Yenyi yahina","Nyi umwe mahasa kutuchiza shili","Kakungu zanga chinji!"]},{"t":"v","n":2,"l":["Mwono kuwazala weswe nyi shili,","Ku luyinda nyi misongo mu mbunge,","Aye yangu kwata nyi kwoko lia keke","Yangwaha sambukila Yenyi yinji."]},{"t":"v","n":3,"l":["Tangwa ha tangwa kakwiza kuli","Yami","Hanga angu lweze lie zango Lienyi;","Nakuzanga kulinyingika chahiana,","Lie zango Lieny kulishi kweseka."]},{"t":"v","n":4,"l":["Zango liami haliapwila ngumuzange,","Ngwambujole chize angulamwinyine","Kwimba zango Lienyi lize liahiana","Nguna tale Zambi mwono mu-usula."]}]},{"n":204,"ti":"Kristu makakwasa","b":[{"t":"v","n":1,"l":["Nyi molu jami mujinguwa,","Kuli milima;","Nyi ungeji mu –unguhwisa,","Kristu mangukwasa."]},{"t":"c","l":["Mangu kwasa,","Makangu funga;","Hakulusu yangu lamwina","Nguli mwe nyi We."]},{"t":"v","n":2,"l":["Nyi makimba machikimisa,","Kali nyi yami;","Mangu pulula phundu,","Kristu mangukwasa."]},{"t":"v","n":3,"l":["Nguli nyi woma wakulutwe,","Kristu mangu kwasa;","Muze tangwa lipi muliza,","Kristu mangu kwasa."]},{"t":"v","n":4,"l":["Chisanyiko Che cha phundu,","Mungu kaheta;","Ami chichi kahona kuya,","Kwe kuma hietu."]}]},{"n":205,"ti":"Mbunge yalamba","b":[{"t":"v","n":1,"l":["Mbunge yina nenganyana,","Kristu mayihuzulula,","Sambukila ukonekeno,","Kuli Yiye mauyitambula."]},{"t":"c","l":["Tweya kawashi kuli Chilamwina,","Kanda wivwa mwongo nyi woma?","Tweya, tweya, kuma kwaha uhwimino."]},{"t":"v","n":2,"l":["Yikola yinji unevu","Yakathuka ku shili ye?","Tweya washi kuli Yesu","Makwaha mwono wa miaka."]},{"t":"v","n":3,"l":["Tweya kuli Chilamwina,","Chipwe uli nyi shili ye;","Tweya Aye mukwa zango,","Makwaha unene wawana."]},{"t":"v","n":4,"l":["Tweya kawashi kuli Kristu,","Kana zange akulamwine;","Kana zange upeme we,","Jikijila kuli Yiye."]}]},{"n":206,"ti":"Jila ja kuhalisa","b":[{"t":"v","n":1,"l":["Tweyenu hanga nungwivwe","Kungu nembila Kristu;","Chilamwina chami phundu,","Yeza nyi kungulamwina!","Mwe Mwana Phanga wa phundu,","Mwe wangu tuswile,","Nyi e manyinga Jenyi","Yangu kosa ye mbunge."]},{"t":"v","n":2,"l":["Kumunguka twama Nenyi,","Mungu kamuhalisa,","Ha yize hanalingi;","Mwene wami nyi Soma","Hindu chipwe upi","Mungu shimbamisa","Hindu kumu ngukemba,","Se Yiye makawenyeka."]},{"t":"v","n":3,"l":["Hakukaula jila","Yina twala mwilu,","Kristu mungu kembila","Yiye mwono wami!","Muze upi mu-ukanguhwa,","Kuzuwo lia usandu,","Shimbu yeswe Kristu mwe","Mungu kahalisa."]}]},{"n":207,"ti":"Tala hakulusu ukawane mwono","b":[{"t":"v","n":1,"l":["Mwono hakutala hakulusu,","Yesu ngwenyi; Tala Yiye;","Upite wa hashi nyi chimwe,","Upite uli he hakulusu."]},{"t":"c","l":["Khachi muhulikila","B.T. khachi muhulikila,","Nyi kutala Ngongota","B.T. nyi kutala Ngongota,","Ulamwino wawana,","B.T. ulamwino wawana,","Hulikila Ngongota."]},{"t":"v","n":2,"l":["Muze namwene mwe Chilamwina,","Huma Lienyi to nyi keke;","Muze yeseko muyingwiza,","Kulusu hehali-ukonekeno."]},{"t":"v","n":3,"l":["Hakutala Yesu hakulusu;","Ngwi-uluke Zambi yilakenyo,","Nyi umwe menda keshi pangu","Mujila yakuya mu malilu."]}]},{"n":208,"ti":"Ngukembe zango lia Zambi","b":[{"t":"v","n":1,"l":["Ngukembe zango lia Zambi,","Zango Lienyi hali yami,","Mumu wejile mwilu","Yafila hali yami."]},{"t":"c","l":["Mungu kemba nyi lie zango,","Kujichinkanguhwa kama;","Kufwa Chenyi mba yangukula,","Mungu kemba zango Lienyi."]},{"t":"v","n":2,"l":["Shimbu kanda nguchilila,","Yesu yalianga kungwivwa;","Shimbu kanda nguchilemba","Ha lamba Aye yalemba."]},{"t":"v","n":3,"l":["Mba kuchi makangu zanga","Nyi chalingile nyi chimwe?","Nguna zange se kumwita,","Ngu mwehe ye mbunge yami."]}]},{"n":209,"ti":"Yesu Yiye Chilamwina","b":[{"t":"v","n":1,"l":["Kristu Yiye Chilamwina,","Ku kushi nawa mukwo,","Hana tufila nyi zango,","Kuli Yiye kuli mwono."]},{"t":"c","l":["Yesu Yiye Chilamwina,","Yiye mwe Chitaka nyishi.","Mwe Yiye watufilile","Hindu kali nyi mwono."]},{"t":"v","n":2,"l":["Akwa usandu ashishika","Chatamba kwasa Vumbi;","Yesu, Soma yamasoma,","Tumuwayilenu eswe."]},{"t":"v","n":3,"l":["Tulembenu kuli Zambi,","Yiye wika mahasa","Kutu kwasa kwe ku lamba;","Zambi mapulula nyi-enyi."]}]},{"n":210,"ti":"Nalilongesa uswamino upema","b":[{"t":"v","n":1,"l":["Nalilongesele jila,","Yakufuliela Yesu;","Yingu wana uhwimino","Natambula pangu Lie.","Nanwine Shima litoma,","Yingweseka zango Lie;","Yiye wapwa thachi jami"]},{"t":"c","l":["Ngutwame muli Mwene,","B.T. Ngutwame muli Mwene","Ngutwame muli Mwene.","Ngufuliele zango Lie;","B.T. Ngufuliele zango Lie;","Ngufuliele zango Lie;","Ngusweke…Ngusweke kama","B.T. ungusweke,","Nyi moko Je, zango Lie."]},{"t":"v","n":2,"l":["Hungu nafu hakulusu,","Kristu kali nyi yami;","Kulithachika hichawa,","Uhenya Kristu, uhenya!","We mwono wami weswe","Nauhana kuli Yesu;","Manyinga Jenyi alemu","Mangu funga mu pangu."]},{"t":"v","n":3,"l":["Kuhanjika nyi mana,","Kulinga nyi unene We;","Kuenda mujila yipema,","Yiye atwame muli yami;","Yiye uchinyino wami,","Shima lia chiseke Yiye,","Mafungu nyi malamwina,","Kujita makukwasa."]}]},{"n":211,"ti":"Ukonekeno, sambukila nyi unene","b":[{"t":"v","n":1,"l":["Nyi tuna zange chiseke,","Zambi matwaha cho,","Nyi kupwa nyi uwayiso,","Wa e maliji Jenyi."]},{"t":"c","l":["Sambukila nyi keke","Ya zango nyi chawana,","Kristu shima lia chiseke;","Aleluya maya kuli Yiye!"]},{"t":"v","n":2,"l":["Nguli nyi chawana Chenyi,","Hanga nguka kumbe;","Spiritu nguli nayo","Yingu chize shili."]},{"t":"v","n":3,"l":["Lie Spiritu likolo","Muli kangu kwasa","Ye mbunge yami yichili","Nyi zuwo kusuku."]},{"t":"v","n":4,"l":["Nyi we ufulielo chashi","Nyi che kutambula,","Kuli Kristu Tata mata,","Kutwaha usoma"]}]},{"n":212,"ti":"Yesu makumbulula","b":[{"t":"v","n":1,"l":["Kulemba che unachinyongo","Ngwe Yesu kana kuvulama?","Tala