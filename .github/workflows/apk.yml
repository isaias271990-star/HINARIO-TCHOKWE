":"v","n":2,"l":["Chipwe nguli mwe kanuke,","Nguzeyele liji Lie,","Ngukaule jila Yenyi,","Chichi kwivwa woma kha."]},{"t":"v","n":3,"l":["Mukwa thachi ngupulule","Ku upi mangu kwasa;","Ngu chinyine kuli Yena","Aye mangu lamwina."]}]},{"n":188,"ti":"Tutemwinyine muli Yesu","b":[{"t":"v","n":1,"l":["Zambi maha twanuke,","Kuze ma-asongwela,","Chiteli cha uhenya;","Kutemukina Yesu","Tutemuke ngwe themo","Ngwe pangu lia Zambi,","Nyi kuchiza milima","Yatujingilika."]},{"t":"c","l":["Tuli pangu likehe,","Lie pangu lipema;","Nyi kumasesa kweswe","Kutemukina Yesu."]},{"t":"v","n":2,"l":["Nyi malelwa kanala","Kanafuku pangu;","Mwono wachinyengo,","Kulusu yinaleme.","Mu lie pangu lipema,","Tulinge milimo","Yakuhana chiseke","Mu mbunge nyi mbunge."]},{"t":"v","n":3,"l":["Kuyuka achi chinene;","Tutemukine Yesu","Nyi kwenyeka milima","Hanga pangu lize.","Nyi manyonga apema","Tulinge nyi zango;","Hanga tupwe misayo","Mba yitwe woma kha."]}]},{"n":189,"ti":"Kachihanda ke","b":[{"t":"v","n":1,"l":["Kristu hana tutumu ngwe pangu","Hanga tutwale akwa shili mwilu.","Achi che kuyuka Aye atuhele;","Ami nyi kami nyi yena nyi ke."]},{"t":"v","n":2,"l":["Chifuchi chazala nyi milima,","Ha pangu lietu, milima muyihwa,","Pangu lia mwilu, Kristu atuhele,","Ami nyi liami nyi yena nyi lie."]},{"t":"v","n":3,"l":["Upale wakanuke mweswawo","Wakuzanga Yesu nyi kwononoka;","Tutemune pangu, lize atuhele,","Ami nyi liami nyi yena nyi lie."]}]},{"n":190,"ti":"Moko apema","b":[{"t":"v","n":1,"l":["Moko jami nguli no","Ngukwate ye Mbimbiliya;","Meso jami nguli no","Nguye nguli longese."]},{"t":"c","l":["Apema apema e moko","Malingila kuli Zambi;","Apema apema e meso","Muze matala mwilu."]},{"t":"v","n":2,"l":["Meso jami nguli no","Nguhase kumona yinji","Moko jami nguli no","Ngulinge yuma yinji."]},{"t":"v","n":3,"l":["Moko jami nguli no","Malingila kuli Yesu;","Meso jami nguli no","Ngutale kuli Yesu."]}]},{"n":191,"ti":"Meza ya Mwene","b":[{"t":"v","n":1,"l":["Yesu, Mwene, twakuzanga!","Tuna lilulieka,","