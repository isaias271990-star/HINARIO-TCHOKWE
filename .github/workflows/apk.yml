name: Build APK e AAB Play Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK e AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Preparar, Compilar APK e AAB
        run: |
          # 1. Renomear pastas se necessario
          [ -d "aplicativo" ] && mv aplicativo app || true
          [ -d "app/src/main/Ativos" ] && mv app/src/main/Ativos app/src/main/assets || true
          [ -d "app/src/main/Assets" ] && mv app/src/main/Assets app/src/main/assets || true

          # 2. Criar pastas necessarias
          mkdir -p app/src/main/assets/data
          mkdir -p app/src/main/assets/dados

          # 3. Copiar arquivos para assets se estiverem fora
          INDEX_FILE=$(find . -name "index.html" | head -n 1)
          if [ -n "$INDEX_FILE" ]; then
            SRC_DIR=$(dirname "$INDEX_FILE")
            if [ "$SRC_DIR" != "app/src/main/assets" ] && [ "$SRC_DIR" != "./app/src/main/assets" ]; then
              echo "Copiando de $SRC_DIR para app/src/main/assets/"
              cp -rf "$SRC_DIR"/* app/src/main/assets/ || true
            fi
          fi

          # 4. Injetar todos os 300 hinos no hinos.js (Garante carregamento 100% offline)
          HINOS_JSON=$(find . -iname "*hinos*.json" | head -n 1)
          if [ -n "$HINOS_JSON" ]; then
            echo "Encontrado arquivo de hinos: $HINOS_JSON"
            python3 - << EOF
          import json, os
          with open('$HINOS_JSON', 'r', encoding='utf-8') as f:
              raw = f.read().strip()
          dados = json.loads(raw)
          js_content = 'window.HINOS = ' + json.dumps(dados, ensure_ascii=False) + ';\n'
          for dest in ['app/src/main/assets/hinos.js', 'hinos.js']:
              os.makedirs(os.path.dirname(dest) if os.path.dirname(dest) else '.', exist_ok=True)
              with open(dest, 'w', encoding='utf-8') as f:
                  f.write(js_content)
              print('Hinos gravados em:', dest)
          EOF
          fi

          # 5. Injetar elementos invisiveis para destravar o app.js
          DUMMY='<div id="elementos-suporte" style="display:none!important;"><button id="fonte-menos"></button><button id="fonte-mais"></button><button id="btn-tema"></button><span id="logo-reserva"></span></div>'
          find . -name "index.html" -exec sed -i "s|<body>|<body>$DUMMY|g" {} + || true

          # 6. Garantir que hinos.js seja carregado antes do app.js no index.html
          python3 - << 'EOF'
          import glob, re
          for p in glob.glob('**/index.html', recursive=True):
              with open(p, 'r', encoding='utf-8') as f:
                  html = f.read()
              if 'hinos.js' not in html:
                  html = re.sub(r'(<script[^>]*app\.js[^>]*></script>)', r'<script src="hinos.js"></script>\n\1', html)
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(html)
          EOF

          # 7. Corrigir o app.js para garantir carregamento da lista
          python3 - << 'EOF'
          import glob, re
          for p in glob.glob('**/*.js', recursive=True):
              with open(p, 'r', encoding='utf-8') as f:
                  t = f.read()
              t = re.sub(r"\$\(['\"]fonte-menos['\"]\)\.onclick", "if ($('fonte-menos')) $('fonte-menos').onclick", t)
              t = re.sub(r"\$\(['\"]fonte-mais['\"]\)\.onclick", "if ($('fonte-mais')) $('fonte-mais').onclick", t)
              t = re.sub(r"\$\(['\"]fonte-menos['\"]\)\.disabled", "if ($('fonte-menos')) $('fonte-menos').disabled", t)
              t = re.sub(r"\$\(['\"]fonte-mais['\"]\)\.disabled", "if ($('fonte-mais')) $('fonte-mais').disabled", t)
              t = re.sub(r"\$\(['\"]btn-tema['\"]\)\.onclick", "if ($('btn-tema')) $('btn-tema').onclick", t)
              # Garantir que ao abrir a lista os hinos aparecam
              if 'function mostrar(' in t and 'carregar()' not in t:
                  t = t.replace("function mostrar(id) {", "function mostrar(id) { if (id === 'lista' && (!HINOS || HINOS.length === 0)) { carregar(); desenharLista(); }")
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(t)
          EOF

          # 8. Injetar a Autoria Oficial limpa
          python3 - << 'EOF'
          import glob, re
          for p in glob.glob('**/index.html', recursive=True):
              with open(p, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = re.sub(r'<footer[\s\S]*?</footer>', '', c)
              creditos = '''<footer style="text-align:center;padding:25px 15px;margin-top:35px;font-size:0.9em;opacity:0.9;border-top:1px solid rgba(128,128,128,0.3);line-height:1.6;">
          <p style="margin:4px 0;font-weight:bold;font-size:1.15em;color:#2e7d32;">Hinário Tchokwe - IASD</p>
          <p style="margin:6px 0;"><strong>Desenvolvedor:</strong> Isaías Muwaneno João IT</p>
          <p style="margin:4px 0;"><strong>Revisão e Correção:</strong> Pastor Nunes Sacavumbi Lucas</p>
          <p style="margin:4px 0;"><strong>Colaboradores:</strong> Líder Ecal Gomes e Líder Januário Justo Miranda</p>
          <p style="margin:10px 0 0 0;font-size:0.8em;opacity:0.75;">Para a Glória de Deus • Edição 2026</p>
          </footer>'''
              if '</body>' in c:
                  c = c.replace('</body>', creditos + '\n</body>')
              else:
                  c = c + creditos
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(c)
          EOF

          # 9. Otimizar para iPhone
          PWA_HEAD='<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Hinário Tchokwe"><link rel="apple-touch-icon" href="icone-512.png">'
          sed -i "s|</head>|$PWA_HEAD</head>|g" app/src/main/assets/index.html || true
          [ -f "icone-512.png" ] && cp -f icone-512.png app/src/main/assets/ || true

          # 10. Forcar Gradle a incluir a pasta assets
          if ! grep -q "assets.srcDirs" app/build.gradle; then
            sed -i '/android {/a \    sourceSets { main { assets.srcDirs = ["src/main/assets"] } }' app/build.gradle || true
          fi

          # 11. Permissoes no MainActivity para Android 14
          MAIN_JAVA=$(find app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_JAVA" ]; then
            if ! grep -q "setAllowFileAccess" "$MAIN_JAVA"; then
              sed -i '/setJavaScriptEnabled/a \        webSettings.setAllowFileAccess(true);\n        webSettings.setAllowContentAccess(true);\n        webSettings.setAllowFileAccessFromFileURLs(true);\n        webSettings.setAllowUniversalAccessFromFileURLs(true);' "$MAIN_JAVA" || true
            fi
          fi

          # 12. Compilar APK e AAB da Play Store
          gradle assembleDebug bundleDebug --stacktrace

          # 13. Garantir integridade dos assets no APK
          if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"; then
            (cd app/src/main && zip -r -u ../../../app/build/outputs/apk/debug/app-debug.apk assets)
          fi

          # 14. Assinar o APK para o Android
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Assinando APK com: $APKSIGNER"
          $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android app/build/outputs/apk/debug/app-debug.apk

          # 15. Organizar saida
          mkdir -p saida_loja
          cp -f app/build/outputs/apk/debug/app-debug.apk saida_loja/Hinario-Tchokwe.apk
          find app/build/outputs/bundle -name "*.aab" -exec cp -f {} saida_loja/Hinario-Tchokwe-PlayStore.aab \;

      - name: Disponibilizar APK e AAB para Download
        uses: actions/upload-artifact@v4
        with:
          name: Hinario-Tchokwe-Arquivos-Finais
          path: saida_loja/*

      - name: Publicar Versão para iPhone
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main/assets
